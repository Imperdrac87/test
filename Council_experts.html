<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Council of Experts Architect v3.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-card {
            background: white;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .input-focus:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
            outline: none;
        }

        .toggle-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .toggle-active {
            background-color: #6366f1 !important;
            color: white !important;
            border-color: #4f46e5 !important;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }

        /* Custom scrollbar for preview */
        .custom-scroll::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        /* Ensure input fields don't zoom on iOS */
        @media screen and (max-width: 768px) {
            input, textarea, select {
                font-size: 16px !important;
            }
        }
    </style>
</head>
<body class="min-h-screen py-4 px-4 sm:py-8 sm:px-6">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="mb-6 sm:mb-8 border-b border-slate-200 pb-6 flex flex-col md:flex-row justify-between items-center gap-4 text-center md:text-left">
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Council of Experts <span class="text-indigo-600">v3.5</span></h1>
                <p class="text-slate-500 font-medium text-sm sm:text-base">Strategic Multi-Persona Prompt Architect</p>
            </div>
            <div class="flex w-full md:w-auto gap-3">
                <button onclick="resetForm()" class="flex-1 md:flex-none px-4 py-2.5 text-sm font-semibold text-slate-600 bg-white border border-slate-200 rounded-xl hover:bg-slate-50 transition active:scale-95">Reset</button>
                <button id="copyBtn" class="flex-1 md:flex-none px-6 py-2.5 text-sm font-bold bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 shadow-md shadow-indigo-100 transition active:scale-95">Copy Prompt</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 sm:gap-8">
            <!-- Left Side: Config -->
            <div class="lg:col-span-7 space-y-6">
                
                <!-- Strategy & Size -->
                <div class="glass-card rounded-2xl p-4 sm:p-6 space-y-6 border-t-4 border-t-indigo-500">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6">
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Council Size</label>
                            <div class="flex p-1 bg-slate-100 rounded-xl gap-1">
                                <button onclick="setSize('small')" id="size-small" class="toggle-btn flex-1 py-2.5 text-xs font-bold rounded-lg bg-white text-slate-600 border border-slate-200 toggle-active">Small (3)</button>
                                <button onclick="setSize('large')" id="size-large" class="toggle-btn flex-1 py-2.5 text-xs font-bold rounded-lg text-slate-600">Large (5+)</button>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Adversarial Mode</label>
                            <div class="flex p-1 bg-slate-100 rounded-xl gap-1">
                                <button onclick="setAdversarial(false)" id="adv-off" class="toggle-btn flex-1 py-2.5 text-xs font-bold rounded-lg bg-white text-slate-600 border border-slate-200 toggle-active">Standard</button>
                                <button onclick="setAdversarial(true)" id="adv-on" class="toggle-btn flex-1 py-2.5 text-xs font-bold rounded-lg text-slate-600">Adversarial</button>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Scenario Blueprint</label>
                        <select id="scenarioSelector" onchange="applyScenario(this.value)" class="w-full p-3.5 sm:p-4 rounded-xl border border-slate-200 text-slate-700 font-medium bg-slate-50 input-focus transition appearance-none">
                            <option value="">-- Select a Life Blueprint --</option>
                            <optgroup label="Professional: Sigma & PhD">
                                <option value="workshopPlanning">Workshop Planning (Material Analysis)</option>
                                <option value="presentationScript">Teleprompter Presentation Scripting</option>
                                <option value="sigmaSupport">Sigma Tutoring (Student Support)</option>
                                <option value="phdReconciliation">PhD Regret & Healing</option>
                                <option value="statsConsult">Statistical Validation Audit</option>
                                <option value="academicReview">PhD-Level Methodology Review</option>
                            </optgroup>
                            <optgroup label="Wellness: Anxiety & Mindfulness">
                                <option value="generalAnxiety">General Anxiety (The Unnamed Worry)</option>
                                <option value="negativeThoughts">Negative Thought Deconstruction</option>
                                <option value="certaintySeeking">OCD Loop (Certainty Seeking)</option>
                                <option value="meditationGuide">Meditation & Grounding Design</option>
                                <option value="viveHodie">Vive Hodie (Live for Today)</option>
                                <option value="faithTheology">Faith Rediscovery (Christ-Centered)</option>
                            </optgroup>
                            <optgroup label="Tech & Interests">
                                <option value="impulsivePurchase">Impulsive Purchase Intervention</option>
                                <option value="crossPlatform">Samsung/Apple/Nintendo Ecosystem</option>
                                <option value="nintendoAnalysis">Nintendo Historical Strategy</option>
                                <option value="historicalContext">Historical Parallel Finder</option>
                            </optgroup>
                        </select>
                    </div>
                </div>

                <div class="glass-card rounded-2xl p-4 sm:p-6 space-y-6">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Primary Objective</label>
                            <input type="text" id="goal" class="w-full p-3.5 rounded-xl border border-slate-200 input-focus text-slate-800 text-sm sm:text-base" placeholder="What are we solving?">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Background & Constraints</label>
                            <textarea id="context" rows="3" class="w-full p-3.5 rounded-xl border border-slate-200 input-focus text-sm sm:text-base" placeholder="Provide background data or personal feelings..."></textarea>
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-xs font-bold text-slate-500 uppercase">The Council Personas</label>
                            <span id="personaCount" class="text-[10px] font-bold text-indigo-500 bg-indigo-50 px-2 py-0.5 rounded">0 Personas</span>
                        </div>
                        <textarea id="experts" rows="6" class="w-full p-3.5 rounded-xl border border-slate-200 input-focus text-sm font-mono leading-relaxed" placeholder="Expert 1: [Perspective]..."></textarea>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Tone</label>
                            <select id="intent" class="w-full p-3 rounded-xl border border-slate-200 input-focus text-sm bg-white">
                                <option value="Compassionate & Calm">Compassionate</option>
                                <option value="Academic & Rigorous">Academic</option>
                                <option value="Direct & Practical">Practical</option>
                                <option value="Visionary & Creative">Creative</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Format</label>
                            <select id="format" class="w-full p-3 rounded-xl border border-slate-200 input-focus text-sm bg-white">
                                <option value="Panel Discussion">Discussion</option>
                                <option value="Detailed Action Plan">Action Plan</option>
                                <option value="Teleprompter Script Format">Script</option>
                                <option value="Consensus Report">Report</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Complexity</label>
                            <select id="complexity" class="w-full p-3 rounded-xl border border-slate-200 input-focus text-sm bg-white">
                                <option value="PhD/Post-Doc">PhD Level</option>
                                <option value="Professional/Senior">Professional</option>
                                <option value="Mentor/Accessible">Mentor</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Side: Preview -->
            <div class="lg:col-span-5">
                <div class="lg:sticky lg:top-8 space-y-4">
                    <div class="glass-card rounded-2xl p-4 sm:p-6 h-[400px] lg:h-[760px] flex flex-col">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-xs font-black text-slate-800 uppercase tracking-widest">Live Prompt Output</h2>
                            <div id="statusTag" class="text-[10px] bg-indigo-100 text-indigo-700 px-2 py-1 rounded font-bold uppercase">Ready</div>
                        </div>
                        <div id="promptOutput" class="flex-grow bg-slate-50 rounded-xl p-4 sm:p-5 text-sm text-slate-600 leading-relaxed font-mono border border-slate-100 overflow-y-auto whitespace-pre-wrap select-all custom-scroll">
                            Select a scenario...
                        </div>
                    </div>
                    <!-- Mobile Toast Container -->
                    <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-6 py-3 bg-slate-900 text-white rounded-2xl text-sm font-bold shadow-2xl animate-bounce">
                        Prompt Copied!
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let councilSize = 'small';
        let isAdversarial = false;
        let currentScenarioKey = '';
        
        const fields = ['goal', 'context', 'experts', 'intent', 'format', 'complexity'];
        const elements = {};
        fields.forEach(f => elements[f] = document.getElementById(f));
        const output = document.getElementById('promptOutput');
        const toast = document.getElementById('toast');
        const personaCountBadge = document.getElementById('personaCount');

        const scenarios = {
            workshopPlanning: {
                goal: "Design a high-engagement workshop for Sigma tutors based on the provided materials.",
                small: "Educational Designer: Focusing on learning outcomes and flow.\nSubject Matter Expert: Analyzing the technical stats materials for accuracy.\nEngagement Specialist: Designing interactive activities to keep tutors alert.",
                large: "Educational Designer: Learning flow.\nSubject Matter Expert: Accuracy audit.\nEngagement Specialist: Interactivity.\nLogistics Coordinator: Timing and breakout management.\nAccessibility Lead: Ensuring materials serve diverse learning needs.",
                intent: "Direct & Practical", format: "Detailed Action Plan", complexity: "Professional/Senior"
            },
            presentationScript: {
                goal: "Create a teleprompter-style script for my upcoming presentation at Sigma.",
                small: "Speechwriter: Crafting a natural, conversational narrative.\nPublic Speaking Coach: Adding markers for [Pause], [Emphasis], and [Eye Contact].\nAudience Analyst: Ensuring the tone matches higher-ed professionals.",
                large: "Speechwriter: Narrative flow.\nPublic Speaking Coach: Delivery cues.\nAudience Analyst: Tone check.\nStatistical Simplifier: Ensuring complex data is explained clearly aloud.\nTimekeeper: Estimating duration and suggesting cuts for brevity.",
                intent: "Visionary & Creative", format: "Teleprompter Script Format", complexity: "Mentor/Accessible"
            },
            sigmaSupport: {
                goal: "Handle a difficult tutoring situation with an anxious student.",
                small: "Master Pedagogue: Simplification strategies.\nEmpathy Coach: Managing stats-phobia.\nSigma Veteran: Navigating UK HE norms.",
                large: "Master Pedagogue: Simplification.\nEmpathy Coach: Anxiety management.\nSigma Veteran: HE norms.\nConflict Manager: De-escalation techniques.\nDiagnostic Expert: Identifying where the student's logic is failing.",
                intent: "Compassionate & Calm", format: "Detailed Action Plan", complexity: "Mentor/Accessible"
            },
            phdReconciliation: {
                goal: "Process doctoral regret and reframe it as a source of strength.",
                small: "Trauma-Informed Therapist: Healing the PhD 'burnout'.\nAcademic Peer: Normalizing the struggle.\nValue Strategist: Highlighting the ROI of the PhD in my current life.",
                large: "Trauma-Informed Therapist: Healing.\nAcademic Peer: Normalization.\nValue Strategist: ROI analysis.\nHistorian: Comparing PhD trials to classical endurance narratives.\nStoic Philosopher: Reclaiming peace from the past.",
                intent: "Compassionate & Calm", format: "Socratic Dialogue", complexity: "Empathetic Mentor"
            },
            generalAnxiety: {
                goal: "Neutralize a feeling of general, unnamed anxiety or impending dread.",
                small: "CBT Specialist: Identifying cognitive distortions.\nNeuroscientist: Explaining the amygdala's 'fight/flight' response.\nStoic Sage: Focusing only on the immediate 'now'.",
                large: "CBT Specialist: Distortions.\nNeuroscientist: Physiological explanation.\nStoic Sage: Immediate presence.\nGrounding Specialist: Physical anchoring exercises.\nRoutine Architect: Designing a simple, 15-minute 'reset' list.",
                intent: "Compassionate & Calm", format: "Panel Discussion", complexity: "Mentor/Accessible"
            },
            negativeThoughts: {
                goal: "Deconstruct a specific negative thought or self-criticism.",
                small: "Logical Analyst: Fact-checking the thought against evidence.\nCompassion Coach: Shifting from 'critic' to 'encourager'.\nBehavioral Scientist: Identifying the trigger for this thought cycle.",
                large: "Logical Analyst: Fact-checking.\nCompassion Coach: Re-parenting the inner critic.\nBehavioral Scientist: Trigger identification.\nResilience Biographer: Recalling times I proved this thought wrong.\nFuture Me (10 Years): Assessing the actual significance of this thought.",
                intent: "Compassionate & Calm", format: "Socratic Dialogue", complexity: "Mentor/Accessible"
            },
            certaintySeeking: {
                goal: "Break the loop of needing 'perfect certainty' before acting.",
                small: "ERP Specialist: Embracing the 'maybe' of life.\nBayesian Statistician: Thinking in likelihoods, not absolutes.\nPragmatic Realist: Defining 'good enough' to prevent paralysis.",
                large: "ERP Specialist: Uncertainty tolerance.\nBayesian Statistician: Probabilities.\nPragmatic Realist: Good enough threshold.\nRisk Analyst: Calculating the cost of inaction vs. incorrect action.\nZen Teacher: Letting go of the desire to control outcomes.",
                intent: "Skeptical & Analytical", format: "Socratic Dialogue", complexity: "Professional/Senior"
            },
            meditationGuide: {
                goal: "Design a 10-minute meditation based on my current mental state.",
                small: "Mindfulness Teacher: Guiding the focus on breath.\nSomatic Coach: Focusing on physical release points.\nZen Monk: Encouraging non-judgmental observation.",
                large: "Mindfulness Teacher: Breath focus.\nSomatic Coach: Physical release.\nZen Monk: Non-judgment.\nMusic/Ambient Specialist: Suggesting specific sonic environments.\nFocus Scientist: Counter-measures for when the mind wanders.",
                intent: "Compassionate & Calm", format: "Detailed Action Plan", complexity: "Mentor/Accessible"
            },
            impulsivePurchase: {
                goal: "Evaluate the urge to buy a new item (e.g., tech/gaming) to prevent impulse regret.",
                small: "Financial Auditor: Budget and ROI check.\nMinimalist Strategist: Assessing long-term utility vs. clutter.\nTech Reviewer: Fact-checking the hype vs. real specs.",
                large: "Financial Auditor: Budget check.\nMinimalist Strategist: Utility check.\nTech Reviewer: Hype vs. Specs.\nFuture Self (1 Year): Checking if I still use this item.\nOpportunity Cost Analyst: What else could this money do?",
                intent: "Direct & Practical", format: "Socratic Dialogue", complexity: "Professional/Senior"
            },
            crossPlatform: {
                goal: "Optimize my Samsung/Apple/Nintendo workflow for maximum efficiency.",
                small: "Ecosystem Architect: Designing cross-device sync systems.\nMinimalist Tech Critic: Eliminating redundant features.\nPrivacy Expert: Managing data silos across platforms.",
                large: "Ecosystem Architect: Sync systems.\nMinimalist Tech Critic: Redundancy check.\nPrivacy Expert: Data silos.\nHardware Engineer: Maximizing longevity of Galaxy A15/Watch FE.\nCost-Benefit Analyst: Managing multi-service subscriptions.",
                intent: "Skeptical & Analytical", format: "Detailed Action Plan", complexity: "Professional/Senior"
            },
            faithTheology: {
                goal: "Explore a life trial through the lens of rediscovering Christ.",
                small: "Biblical Counselor: Scriptural grounding.\nChristian Philosopher: Intellectual reconciliation of trials.\nPastoral Guide: Emotional and spiritual presence.",
                large: "Biblical Counselor: Scripture.\nChristian Philosopher: Intellect.\nPastoral Guide: Presence.\nChurch Historian: Parallel trials in the early church.\nGrace-Focused Mentor: Releasing the 'performance' of faith.",
                intent: "Compassionate & Calm", format: "Panel Discussion", complexity: "PhD/Post-Doc"
            },
            statsConsult: {
                goal: "Audit the assumptions of a complex statistical model.",
                small: "Senior Statistician: P-values and power.\nLead Methodologist: Bias and variables.\nSkeptical Peer: Playing Devil's Advocate.",
                large: "Senior Statistician: P/Power.\nLead Methodologist: Bias.\nSkeptical Peer: Devil's Advocate.\nSoftware Specialist: Implementation logic (R/SPSS).\nEthics Auditor: Data integrity check.",
                intent: "Academic & Rigorous", format: "Consensus Report", complexity: "PhD/Post-Doc"
            }
        };

        function setSize(val) {
            councilSize = val;
            document.getElementById('size-small').classList.toggle('toggle-active', val === 'small');
            document.getElementById('size-large').classList.toggle('toggle-active', val === 'large');
            if (currentScenarioKey) applyScenario(currentScenarioKey);
            else updatePreview();
        }

        function setAdversarial(val) {
            isAdversarial = val;
            document.getElementById('adv-off').classList.toggle('toggle-active', !val);
            document.getElementById('adv-on').classList.toggle('toggle-active', val);
            updatePreview();
        }

        function applyScenario(key) {
            if (!key || !scenarios[key]) return;
            currentScenarioKey = key;
            const s = scenarios[key];
            elements.goal.value = s.goal;
            elements.experts.value = councilSize === 'large' ? s.large : s.small;
            elements.intent.value = s.intent;
            elements.format.value = s.format;
            elements.complexity.value = s.complexity;
            updatePreview();
        }

        function updatePreview() {
            const goal = elements.goal.value || "[INSERT GOAL]";
            const ctx = elements.context.value ? `\nBACKGROUND & CONSTRAINTS:\n${elements.context.value}\n` : "";
            const rawExperts = elements.experts.value || "";
            const expertArray = rawExperts.split('\n').filter(l => l.trim());
            personaCountBadge.textContent = `${expertArray.length} Persona${expertArray.length === 1 ? '' : 's'}`;

            const sizeText = councilSize === 'large' 
                ? "This is a LARGE COUNCIL. Broaden perspectives to include deep ethical, historical, and long-term consequences." 
                : "This is a SMALL COUNCIL. Focus strictly on efficiency and immediate action.";

            const advText = isAdversarial 
                ? "\nADVERSARIAL PROTOCOL: Designate one council member as the 'Critical Challenger.' They must highlight groupthink and potential failure points."
                : "";

            const prompt = `Act as a "Council of Experts" gathered for a high-stakes strategic session.

OBJECTIVE: ${goal}
${ctx}
THE COUNCIL:
Simulate a session featuring these personas:
${expertArray.map(l => `- ${l.trim()}`).join('\n')}

SESSION PARAMETERS:
1. STRATEGY: ${sizeText}
2. TONE: ${elements.intent.value} at a ${elements.complexity.value} depth.
3. FORMAT: Deliver as a ${elements.format.value}.${advText}

SYNTHESIS:
End with a "Council Consensus" section providing a unified, actionable path forward.

Proceed with the Council session.`;

            output.textContent = prompt;
        }

        function resetForm() {
            fields.forEach(f => {
                if (elements[f].tagName === 'SELECT') elements[f].selectedIndex = 0;
                else elements[f].value = "";
            });
            currentScenarioKey = '';
            setSize('small');
            setAdversarial(false);
            document.getElementById('scenarioSelector').selectedIndex = 0;
            updatePreview();
        }

        async function copyToClipboard() {
            const text = output.textContent;
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2500);
        }

        fields.forEach(f => elements[f].addEventListener('input', updatePreview));
        document.getElementById('copyBtn').addEventListener('click', copyToClipboard);
        window.onload = updatePreview;
    </script>
</body>
</html>
