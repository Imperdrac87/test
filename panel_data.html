<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Econometrics Arcade: Sigma Labs</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (CDNJS for stability) -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    
    <!-- Prop Types (Required for some UMD builds of Recharts) -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
    
    <!-- Recharts -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.2/Recharts.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

    <!-- Custom Styles -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        
        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: #050608;
            color: #e2e8f0;
            overflow-x: hidden;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #334155; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569; 
        }

        /* Animation Keyframes */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes pulse-glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        .animate-in { animation: fadeIn 0.5s ease-out; }
        .slide-in { animation: slideUp 0.5s ease-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="env,react">
        const { useState, useEffect, useRef } = React;
        const { ScatterChart, Scatter, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = Recharts;

        // --- ICONS (SVG Components) ---
        const Icon = ({ path, color = "currentColor", size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {path}
            </svg>
        );

        const Icons = {
            Clock: (props) => <Icon {...props} path={<React.Fragment><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></React.Fragment>} />,
            Flame: (props) => <Icon {...props} path={<React.Fragment><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.1.2-2.2.5-3.3.3-1.1 1-2.3 2.5-3.2"/></React.Fragment>} />,
            XCircle: (props) => <Icon {...props} path={<React.Fragment><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></React.Fragment>} />,
            CheckCircle: (props) => <Icon {...props} path={<React.Fragment><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></React.Fragment>} />,
            AlertTriangle: (props) => <Icon {...props} path={<React.Fragment><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></React.Fragment>} />,
            Brain: (props) => <Icon {...props} path={<React.Fragment><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></React.Fragment>} />,
            Activity: (props) => <Icon {...props} path={<React.Fragment><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></React.Fragment>} />,
            Terminal: (props) => <Icon {...props} path={<React.Fragment><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></React.Fragment>} />,
            Lock: (props) => <Icon {...props} path={<React.Fragment><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></React.Fragment>} />,
            Zap: (props) => <Icon {...props} path={<React.Fragment><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></React.Fragment>} />,
            ChevronRight: (props) => <Icon {...props} path={<React.Fragment><polyline points="9 18 15 12 9 6"/></React.Fragment>} />,
            Search: (props) => <Icon {...props} path={<React.Fragment><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></React.Fragment>} />,
            HelpCircle: (props) => <Icon {...props} path={<React.Fragment><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></React.Fragment>} />,
            Eye: (props) => <Icon {...props} path={<React.Fragment><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></React.Fragment>} />,
            ShieldAlert: (props) => <Icon {...props} path={<React.Fragment><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></React.Fragment>} />,
            RefreshCw: (props) => <Icon {...props} path={<React.Fragment><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></React.Fragment>} />,
            ArrowRight: (props) => <Icon {...props} path={<React.Fragment><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></React.Fragment>} />,
            Scale: (props) => <Icon {...props} path={<React.Fragment><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2v2"/><path d="M17 7h2v2"/></React.Fragment>} />
        };

        // --- THEME ---
        const theme = {
            bg: "min-h-screen bg-[#050608] font-mono text-slate-200 pb-12",
            container: "max-w-5xl mx-auto p-3 md:p-6",
            card: "bg-slate-900/80 backdrop-blur-md rounded-xl border border-slate-700 shadow-[0_0_15px_rgba(0,224,255,0.05)] p-4 md:p-6 mb-6 transition-all duration-300 relative overflow-hidden",
            header: "text-2xl md:text-5xl font-bold text-white tracking-tighter mb-2 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-400",
            subHeader: "text-slate-400 tracking-widest uppercase text-[10px] md:text-sm mb-6",
            
            buttonPrimary: "w-full md:w-auto group relative px-6 py-4 md:py-3 bg-cyan-900/20 hover:bg-cyan-500/20 text-cyan-400 hover:text-cyan-200 border border-cyan-500/50 hover:border-cyan-400 rounded transition-all duration-200 uppercase tracking-widest font-bold text-xs flex items-center justify-center gap-2 shadow-[0_0_10px_rgba(6,182,212,0.1)] hover:shadow-[0_0_15px_rgba(6,182,212,0.4)] active:scale-95 cursor-pointer",
            buttonSecondary: "px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white border border-slate-700 rounded transition-all text-xs uppercase tracking-wide flex items-center justify-center gap-2 active:scale-95 cursor-pointer",
            buttonDanger: "px-3 py-1 bg-red-900/20 hover:bg-red-500/20 text-red-400 border border-red-500/50 rounded transition-all text-[10px] uppercase tracking-widest flex items-center gap-2 active:scale-95 cursor-pointer",
            
            lifelineBtn: "flex items-center justify-between w-full p-3 mb-2 rounded border border-slate-700 bg-slate-800/50 hover:bg-slate-700 hover:border-cyan-500 transition-all text-xs text-slate-300 disabled:opacity-40 disabled:cursor-not-allowed group active:bg-slate-800 cursor-pointer",
            
            tabContainer: "flex border-b border-slate-700 mb-6 overflow-x-auto", 
            tabActive: "flex-1 py-3 text-center border-b-2 border-cyan-500 text-cyan-400 font-bold bg-cyan-900/10 transition-all text-xs md:text-sm whitespace-nowrap px-4 cursor-pointer",
            tabInactive: "flex-1 py-3 text-center border-b-2 border-transparent text-slate-500 hover:text-slate-300 hover:bg-slate-800/50 transition-all text-xs md:text-sm whitespace-nowrap px-4 cursor-pointer",
            
            math: "font-mono text-purple-300 bg-purple-900/20 px-2 py-1 rounded border border-purple-500/30 text-xs md:text-sm inline-block mx-1",
            mathBlock: "font-mono text-center block my-2 text-slate-300 bg-black/30 p-2 rounded border border-slate-800 text-xs md:text-sm tracking-wide",
            
            hintPanel: "mt-4 bg-yellow-900/10 border border-yellow-500/30 p-3 rounded animate-in ring-1 ring-yellow-500/50 shadow-[0_0_15px_rgba(234,179,8,0.1)]",
        };

        // --- LOGIC: DATA GEN ---
        const generatePanelData = (nGroups, tPeriods, correlated) => {
            const data = [];
            const groups = [];
            for (let i = 0; i < nGroups; i++) {
                const effect = correlated ? (i * 8) - 10 : ((Math.random() * 30) - 15);
                groups.push({ id: i, name: `Subject_0${i+1}`, effect });
            }
            groups.forEach(group => {
                for (let t = 0; t < tPeriods; t++) {
                    const xBase = correlated ? (group.effect + 20) / 4 : 5;
                    const x = xBase + Math.random() * 5; 
                    const noise = (Math.random() * 4) - 2;
                    const y = 10 + (2 * x) + group.effect + noise;
                    data.push({
                        groupId: group.id,
                        name: group.name,
                        x: parseFloat(x.toFixed(2)),
                        y: parseFloat(y.toFixed(2)),
                    });
                }
            });
            return { data, groups };
        };

        // --- LOGIC: SCENARIO ---
        const generateScenario = (level) => {
            const types = ['VISUAL', 'NARRATIVE', 'HAUSMAN'];
            const allowedTypes = level === 1 ? ['VISUAL', 'NARRATIVE'] : types;
            const type = allowedTypes[Math.floor(Math.random() * allowedTypes.length)];
            const isCorrelated = Math.random() > 0.5;

            let content = {};

            if (type === 'VISUAL') {
                content = {
                    ...generatePanelData(5, 8, isCorrelated),
                    type: 'VISUAL',
                    question: "Scan the data. Does X (Horizontal) clearly segregate the groups?",
                    logic: isCorrelated 
                        ? "Look at how the colors are separated horizontally. Low X = Red Group, High X = Purple Group. This means X is related to the Group ID. This is Endogeneity." 
                        : "The colors are mixed up like confetti. X has no relationship with the Group ID. The groups are just random noise."
                };
            } else if (type === 'NARRATIVE') {
                const scenarios = isCorrelated ? [
                    { text: "Tracking 'Fun Factor' of games. The unobserved 'Nostalgia' factor is fixed for each franchise (Mario vs Zelda) and drives sales (X).", hint: "Fixed trait (Nostalgia) -> Correlated with X -> FE.", logic: "Since 'Nostalgia' is a fixed trait of the game and it affects Sales (X), you have Correlation. You MUST use Fixed Effects." },
                    { text: "Studying impact of 'Study Hours' on grades. Unobserved 'Innate Ability' makes smart students study less.", hint: "Ability -> Correlated with Study Hours -> FE.", logic: "Unobserved Ability is linked to Study Hours (the X variable). This is textbook Endogeneity. Fixed Effects is required." }
                ] : [
                    { text: "Testing 500 random controllers. We want to see if 'Button Click Speed' affects win rates. 'Manufacturing Defect' is random noise.", hint: "Random sample -> No correlation -> RE.", logic: "The controllers are random draws. The defects are random noise. No correlation means Random Effects is safe and more efficient." },
                    { text: "Surveying 5 random people about lunch prices. 'Personal Taste' is just background noise.", hint: "Random people -> No bias -> RE.", logic: "These are random people. Their personal quirks are not systematically linked to the variables. Random Effects is optimal." }
                ];
                const sc = scenarios[Math.floor(Math.random() * scenarios.length)];
                content = { type: 'NARRATIVE', text: sc.text, hint: sc.hint, question: "Analyze the context.", logic: sc.logic };
            } else if (type === 'HAUSMAN') {
                const pValue = isCorrelated ? (Math.random() * 0.04).toFixed(4) : (0.10 + Math.random() * 0.8).toFixed(4);
                const chi2 = isCorrelated ? (20 + Math.random() * 50).toFixed(2) : (0 + Math.random() * 2).toFixed(2);
                
                content = {
                    type: 'HAUSMAN',
                    pValue,
                    chi2,
                    question: "Interpret the Hausman Test result.",
                    hint: isCorrelated ? "P < 0.05 means 'Reject Randomness'." : "P > 0.05 means 'Fail to Reject Randomness'.",
                    logic: isCorrelated 
                        ? `P-value (${pValue}) is less than 0.05. We REJECT the Null Hypothesis. The errors are NOT random. You must use Fixed Effects.` 
                        : `P-value (${pValue}) is greater than 0.05. We cannot reject the Null. The errors are likely random. Random Effects is safe.`
                };
            }

            return { ...content, isCorrelated, correctModel: isCorrelated ? 'FE' : 'RE' };
        };

        // --- COMPONENTS ---

        const MathBlock = ({ children }) => (
            <div className={theme.mathBlock}>{children}</div>
        );

        const ExplanationCard = ({ title, type, children }) => {
            let colorClass = "border-slate-700 bg-slate-800/50 text-slate-200";
            let iconColor = "text-slate-400";
            let IconCmp = Icons.Activity;

            if (type === 'FE') {
                colorClass = "border-cyan-500/30 bg-cyan-900/10 text-cyan-200";
                iconColor = "text-cyan-400";
                IconCmp = Icons.Terminal;
            } else if (type === 'RE') {
                colorClass = "border-purple-500/30 bg-purple-900/10 text-purple-200";
                iconColor = "text-purple-400";
                IconCmp = Icons.Brain;
            } else if (type === 'HAUSMAN') {
                colorClass = "border-yellow-500/30 bg-yellow-900/10 text-yellow-200";
                iconColor = "text-yellow-400";
                IconCmp = Icons.Scale;
            }

            return (
                <div className={`p-4 rounded border ${colorClass} mb-4 relative overflow-hidden group transition-all duration-300 hover:border-opacity-50 h-full`}>
                    <div className={`absolute top-0 right-0 p-2 opacity-20 group-hover:opacity-40 transition-opacity ${iconColor}`}>
                        <IconCmp size={32} />
                    </div>
                    <h3 className={`font-bold text-base md:text-lg mb-2 flex items-center gap-2 ${iconColor} uppercase tracking-wider`}>
                        <IconCmp size={16}/>
                        {title}
                    </h3>
                    <div className="space-y-3 leading-relaxed text-xs md:text-sm opacity-90">{children}</div>
                </div>
            );
        };

        const ChartContainer = ({ children, title }) => (
            <div className="h-56 md:h-80 bg-slate-900 rounded-lg border border-slate-700 p-2 relative overflow-hidden shadow-inner w-full">
                <div className="absolute inset-0 opacity-10 pointer-events-none" 
                     style={{backgroundImage: 'radial-gradient(#4b5563 1px, transparent 1px)', backgroundSize: '20px 20px'}}>
                </div>
                {title && <div className="absolute top-2 right-3 text-[10px] text-slate-500 uppercase tracking-widest font-bold z-10">{title}</div>}
                <ResponsiveContainer width="100%" height="100%">
                    {children}
                </ResponsiveContainer>
            </div>
        );

        // --- MAIN APP COMPONENT ---

        const App = () => {
            const [phase, setPhase] = useState('intro'); // intro, game

            return (
                <div className={theme.bg}>
                    {phase === 'intro' ? (
                        <LabMode onComplete={() => setPhase('game')} />
                    ) : (
                        <GameMode onQuit={() => setPhase('intro')} />
                    )}
                </div>
            );
        };

        const LabMode = ({ onComplete }) => {
            const [activeTab, setActiveTab] = useState('fe');
            const [simulation, setSimulation] = useState(generatePanelData(3, 10, true)); 

            const regenerate = () => {
                const isCorr = activeTab === 'fe' || activeTab === 'hausman'; 
                setSimulation(generatePanelData(3, 10, isCorr));
            };

            useEffect(() => regenerate(), [activeTab]);

            return (
                <div className={`${theme.container} pt-8 md:pt-12 animate-in`}>
                    <div className="text-center mb-6 md:mb-10">
                        <div className="inline-block relative">
                           <div className="absolute -inset-1 bg-gradient-to-r from-cyan-500 to-purple-600 rounded-lg blur opacity-25 animate-pulse"></div>
                           <h1 className={theme.header}>SIGMA LABS</h1>
                        </div>
                        <p className={theme.subHeader}>Error Structure Analysis Protocol</p>
                    </div>

                    <div className={theme.card}>
                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-cyan-500 via-purple-500 to-cyan-500 opacity-50"></div>
                        
                        <div className={theme.tabContainer}>
                            <button onClick={() => setActiveTab('fe')} className={activeTab === 'fe' ? theme.tabActive : theme.tabInactive}>
                                FIXED EFFECTS
                            </button>
                            <button onClick={() => setActiveTab('re')} className={activeTab === 're' ? theme.tabActive : theme.tabInactive}>
                                RANDOM EFFECTS
                            </button>
                            <button onClick={() => setActiveTab('hausman')} className={activeTab === 'hausman' ? theme.tabActive : theme.tabInactive}>
                                HAUSMAN TEST
                            </button>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-8">
                            <div className="space-y-4">
                                {activeTab === 'fe' && (
                                    <ExplanationCard title="The 'Unique Character' Approach (FE)" type="FE">
                                        <p>Imagine playing Mario Kart. <strong>Bowser</strong> is always heavy, and <strong>Toad</strong> is always light.</p>
                                        <p>These traits are <strong>Fixed</strong> and specific to that character. We can't change them.</p>
                                        
                                        <div className="my-4 border-l-2 border-cyan-500 pl-3">
                                            <p className="text-[10px] text-cyan-400 uppercase font-bold mb-1">How FE Works:</p>
                                            <p>We calculate a specific "handicap" or "bonus" for <strong>every single player</strong>. We assume they are unique entities.</p>
                                        </div>

                                        <MathBlock>
                                          y<sub>it</sub> = βx<sub>it</sub> + α<sub>i</sub> + ε<sub>it</sub>
                                        </MathBlock>
                                        
                                        <div className="bg-cyan-900/20 p-3 mt-2 text-xs rounded">
                                           <strong>Trade-off:</strong> It is <span className="text-green-400">SAFE</span> (removes bias from hidden traits) but <span className="text-red-400">EXPENSIVE</span> (uses up data to calculate all those unique scores).
                                        </div>
                                    </ExplanationCard>
                                )}
                                
                                {activeTab === 're' && (
                                    <ExplanationCard title="The 'Loot Box' Approach (RE)" type="RE">
                                        <p>Imagine opening 5 loot boxes. You might get a Legendary item or a Common one.</p>
                                        <p>We don't care *which* specific box it is; we care about the <strong>Random Distribution</strong> of luck.</p>

                                        <div className="my-4 border-l-2 border-purple-500 pl-3">
                                            <p className="text-[10px] text-purple-400 uppercase font-bold mb-1">How RE Works:</p>
                                            <p>We assume the differences are just random noise (like rolling dice), not fixed characteristics.</p>
                                        </div>

                                        <MathBlock>
                                          y<sub>it</sub> = βx<sub>it</sub> + α + (u<sub>i</sub> + ε<sub>it</sub>)
                                        </MathBlock>
                                         
                                         <div className="bg-purple-900/20 p-3 mt-2 text-xs rounded">
                                           <strong>Trade-off:</strong> It is <span className="text-green-400">EFFICIENT</span> (saves data) but <span className="text-red-400">RISKY</span>. If "Luck" is actually rigged (correlated with your variables), your model fails.
                                        </div>
                                    </ExplanationCard>
                                )}

                                {activeTab === 'hausman' && (
                                    <ExplanationCard title="The Hausman Protocol" type="HAUSMAN">
                                        <p>A "Lie Detector" test. It checks if the Efficient Model (RE) is telling the truth compared to the Safe Model (FE).</p>
                                        <div className="space-y-2 mt-2">
                                            <div className="flex justify-between border-b border-yellow-500/30 pb-1">
                                                <span className="text-xs text-slate-400">Null Hypothesis (H<sub>0</sub>)</span>
                                                <span className="text-xs text-green-400 font-bold">"RE is Safe"</span>
                                            </div>
                                            <div className="flex justify-between border-b border-yellow-500/30 pb-1">
                                                <span className="text-xs text-slate-400">Alternative (H<sub>1</sub>)</span>
                                                <span className="text-xs text-red-400 font-bold">"RE is Biased"</span>
                                            </div>
                                        </div>
                                        <div className="bg-yellow-900/20 border-l-2 border-yellow-500 p-3 mt-2 text-xs">
                                           <strong>The Golden Rule:</strong>
                                           <ul className="list-disc pl-4 mt-1 space-y-1">
                                               <li><strong>P &lt; 0.05:</strong> Reject Null. RE is biased. <span className="text-cyan-400 font-bold">USE FE.</span></li>
                                               <li><strong>P &gt; 0.05:</strong> Accept Null. RE is safe. <span className="text-purple-400 font-bold">USE RE.</span></li>
                                           </ul>
                                        </div>
                                    </ExplanationCard>
                                )}
                                
                                <button onClick={regenerate} className={theme.buttonSecondary + " w-full"}>
                                    <Icons.RefreshCw size={14} /> Reshuffle Data
                                </button>
                            </div>

                            <div className="flex flex-col gap-2">
                                {activeTab === 'hausman' ? (
                                    <div className="h-56 md:h-80 bg-black border border-slate-700 rounded-lg p-6 font-mono text-sm flex flex-col justify-center items-center shadow-inner">
                                        <div className="w-full max-w-sm">
                                            <p className="text-green-500 mb-4">$ hausman fixed random</p>
                                            <p className="text-slate-400 text-xs mb-1">Test:  Ho:  difference in coefficients not systematic</p>
                                            <p className="text-slate-200 text-xs mb-4">       chi2(1) = (b-B)'[(V<sub>b</sub>-V<sub>B</sub>)<sup>-1</sup>](b-B) = 45.21</p>
                                            
                                            <div className="animate-pulse bg-yellow-900/30 border border-yellow-500/50 p-4 rounded text-center">
                                                <p className="text-yellow-500 font-bold text-lg">Prob &gt; chi2 = 0.0000</p>
                                                <p className="text-red-400 text-xs mt-2 uppercase tracking-widest font-bold">REJECT NULL HYPOTHESIS</p>
                                            </div>
                                            <p className="text-center text-slate-500 text-[10px] mt-4">
                                                (P-value is low -> Fixed Effects is Required)
                                            </p>
                                        </div>
                                    </div>
                                ) : (
                                    <ChartContainer title={activeTab === 're' ? "Visualizing Variance (uᵢ)" : "Visualizing Fixed Intercepts (αᵢ)"}>
                                        <ScatterChart margin={{ top: 20, right: 20, bottom: 20, left: 0 }}>
                                            <CartesianGrid strokeDasharray="3 3" stroke="#1e293b" />
                                            <XAxis type="number" dataKey="x" stroke="#64748b" fontSize={10} tickLine={false} />
                                            <YAxis type="number" dataKey="y" stroke="#64748b" fontSize={10} tickLine={false} />
                                            <Tooltip contentStyle={{ backgroundColor: '#0f172a', borderColor: '#334155', color: '#f8fafc', fontSize: '12px' }}/>
                                            {simulation.groups.map((g, idx) => (
                                                <Scatter 
                                                    key={g.id} 
                                                    name={g.name} 
                                                    data={simulation.data.filter(d => d.groupId === g.id)} 
                                                    fill={['#22d3ee', '#a78bfa', '#f472b6'][idx % 3]} 
                                                    shape="circle"
                                                />
                                            ))}
                                        </ScatterChart>
                                    </ChartContainer>
                                )}
                            </div>
                        </div>

                        <div className="mt-8 flex justify-end border-t border-slate-800 pt-6">
                           <button onClick={onComplete} className={theme.buttonPrimary}>
                             Initiate Simulation <Icons.ArrowRight size={16} />
                           </button>
                        </div>
                    </div>
                </div>
            );
        };

        const GameMode = ({ onQuit }) => {
            const [level, setLevel] = useState(1);
            const [score, setScore] = useState(200); 
            const [streak, setStreak] = useState(0);
            const [gameState, setGameState] = useState('playing'); 
            const [currentScenario, setCurrentScenario] = useState(null);
            const [feedback, setFeedback] = useState(null);
            const [timeLeft, setTimeLeft] = useState(30);
            const [timerActive, setTimerActive] = useState(true);
            const [hintVisible, setHintVisible] = useState(false);
            const [isRevealModalOpen, setIsRevealModalOpen] = useState(false);
            const hintRef = useRef(null);

            useEffect(() => {
                if (gameState === 'playing') {
                    setCurrentScenario(generateScenario(level));
                    setTimeLeft(30); 
                    setTimerActive(true);
                    setHintVisible(false);
                    setIsRevealModalOpen(false);
                }
            }, [gameState, level]);

            useEffect(() => {
                let interval = null;
                if (timerActive && timeLeft > 0) {
                    interval = setInterval(() => {
                        setTimeLeft((prev) => prev - 1);
                    }, 1000);
                } else if (timeLeft === 0 && timerActive) {
                    setTimerActive(false);
                    handleTimeout();
                }
                return () => clearInterval(interval);
            }, [timerActive, timeLeft]);

            useEffect(() => {
                if(hintVisible && hintRef.current) {
                    hintRef.current.scrollIntoView({ behavior: 'smooth', block: 'end' });
                }
            }, [hintVisible]);

            const handleTimeout = () => {
                setFeedback({
                    success: false,
                    title: "TEMPORAL FAILURE",
                    msg: "The data stream expired before you could classify the error structure."
                });
                setStreak(0);
                setGameState('feedback');
            };

            const makeChoice = (choice) => {
                setTimerActive(false);
                const correct = currentScenario.correctModel;
                const isWin = choice === correct;

                if (isWin) {
                    const timeBonus = timeLeft * 10;
                    const streakBonus = streak * 50;
                    setScore(prev => prev + 100 + timeBonus + streakBonus);
                    setStreak(prev => prev + 1);
                    setFeedback({ 
                        success: true, 
                        title: "OPTIMAL MODEL", 
                        msg: currentScenario.logic 
                    });
                } else {
                    setStreak(0);
                    setFeedback({
                        success: false,
                        title: "MODEL REJECTED",
                        msg: `Incorrect. The correct model was ${correct}. ${currentScenario.logic}`
                    });
                }
                setGameState('feedback');
            };

            const useLifeline = (type) => {
                if (type === 'HAUSMAN') {
                    if (score < 50) return;
                    setScore(s => s - 50);
                    const pVal = currentScenario.isCorrelated ? "0.002" : "0.754";
                    alert(`HAUSMAN TERMINAL: P-value = ${pVal}`);
                } else if (type === 'ORACLE') {
                    if (score < 20) return;
                    setScore(s => s - 20);
                    setHintVisible(true);
                }
            };

            const handleSurrender = () => {
                setTimerActive(false);
                setScore(Math.max(0, score - 100));
                setStreak(0);
                setIsRevealModalOpen(true);
            };

            const closeReveal = () => {
                setIsRevealModalOpen(false);
                setGameState('feedback');
                setFeedback({
                    success: false,
                    title: "SIMULATION ABORTED",
                    msg: "Manual override initiated. Data stream compromised."
                });
            };

            if (!currentScenario) return <div className="h-screen flex items-center justify-center text-cyan-500 font-mono tracking-widest animate-pulse">GENERATING SCENARIO...</div>;

            return (
                <div className={`${theme.container} pt-4 animate-in slide-in relative`}>
                    
                    {isRevealModalOpen && (
                        <div className="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-in zoom-in-95">
                            <div className="bg-slate-900 border-2 border-red-500 rounded-lg p-6 max-w-lg w-full shadow-[0_0_50px_rgba(239,68,68,0.2)] flex flex-col max-h-[90vh]">
                                <div className="text-center mb-6 shrink-0">
                                    <Icons.ShieldAlert size={48} className="text-red-500 mx-auto mb-2" />
                                    <h2 className="text-2xl md:text-3xl font-bold text-white uppercase tracking-tighter">Classified Data</h2>
                                    <p className="text-red-400 font-mono text-sm">SECURITY CLEARANCE OVERRIDDEN</p>
                                </div>
                                <div className="overflow-y-auto flex-1 mb-4 space-y-6">
                                    <div className="bg-slate-800 p-4 rounded border border-slate-700">
                                        <p className="text-xs text-slate-500 uppercase tracking-widest mb-2">Correct Specification:</p>
                                        <p className="text-2xl md:text-3xl font-bold text-white flex items-center justify-center gap-3">
                                            {currentScenario.correctModel === 'FE' ? <Icons.Lock className="text-cyan-400"/> : <Icons.Zap className="text-purple-400"/>}
                                            {currentScenario.correctModel === 'FE' ? "FIXED EFFECTS" : "RANDOM EFFECTS"}
                                        </p>
                                    </div>
                                    <div>
                                         <p className="text-xs text-slate-500 uppercase tracking-widest mb-2">Deep Logic Protocol:</p>
                                         <p className="text-slate-300 text-sm leading-relaxed border-l-2 border-red-500 pl-4">
                                            {currentScenario.logic}
                                         </p>
                                    </div>
                                </div>
                                <button onClick={closeReveal} className="shrink-0 w-full bg-red-900/50 hover:bg-red-500 text-red-200 hover:text-white border border-red-500 py-3 rounded uppercase font-bold tracking-widest transition-colors">
                                    Close & Reboot System
                                </button>
                            </div>
                        </div>
                    )}

                    <div className="bg-slate-900/95 border-b-2 border-slate-700 p-3 sticky top-0 z-30 backdrop-blur-md rounded-b-xl shadow-lg mb-6 flex flex-col md:flex-row justify-between items-center gap-3 md:gap-4">
                        <div className="flex items-center gap-4 w-full md:w-auto justify-between md:justify-start">
                            <div className="bg-slate-800 px-3 py-1 rounded border border-slate-600 flex items-center gap-2">
                                <span className="text-[10px] text-slate-500 uppercase tracking-widest">Level</span>
                                <span className="text-xl font-bold text-white">{level}</span>
                            </div>
                            <div className="w-32 md:w-48 h-8 bg-slate-800 rounded-lg border border-slate-600 relative overflow-hidden flex items-center justify-center">
                                <div 
                                    className={`absolute left-0 top-0 h-full transition-all duration-1000 linear ${timeLeft < 10 ? 'bg-red-500' : 'bg-cyan-500'}`} 
                                    style={{ width: `${(timeLeft / 30) * 100}%` }}
                                ></div>
                                <div className="relative z-10 font-mono font-bold text-white drop-shadow-md flex items-center gap-2 text-xs md:text-sm">
                                    <Icons.Clock size={14}/> {timeLeft}s
                                </div>
                            </div>
                        </div>
                        <div className="flex items-center gap-3 w-full md:w-auto justify-between md:justify-end">
                            <div className="flex items-center gap-2">
                                {streak > 1 && (
                                    <div className="text-orange-400 font-bold animate-bounce flex items-center gap-1 text-xs">
                                        <Icons.Flame size={14} /> {streak}x
                                    </div>
                                )}
                                <span className="text-xl md:text-2xl font-bold text-yellow-400 font-mono bg-slate-800 px-3 py-1 rounded border border-yellow-600/30">
                                    {score.toString().padStart(4, '0')}
                                </span>
                            </div>
                            <button onClick={onQuit} className={theme.buttonDanger}>
                                <Icons.XCircle size={14} /> Quit
                            </button>
                        </div>
                    </div>

                    <div className={theme.card}>
                        <div className="absolute top-0 right-0 p-4 opacity-10 pointer-events-none">
                            <Icons.Terminal size={120} className="text-cyan-500" />
                        </div>

                        {gameState === 'playing' ? (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 md:gap-8">
                                <div className="lg:col-span-2">
                                    <div className="flex items-start md:items-center gap-3 mb-4 bg-slate-800/50 p-3 rounded border-l-4 border-cyan-500">
                                        <Icons.Search size={20} className="shrink-0 text-cyan-400 mt-1 md:mt-0" />
                                        <p className="text-xs md:text-sm font-mono text-cyan-100 leading-relaxed">
                                           {currentScenario.question}
                                        </p>
                                    </div>

                                    {currentScenario.type === 'VISUAL' && (
                                        <div className="mb-4">
                                            <ChartContainer title="Visual Scan">
                                                <ScatterChart>
                                                    <CartesianGrid strokeDasharray="3 3" stroke="#1e293b" />
                                                    <XAxis type="number" dataKey="x" name="X" stroke="#64748b" fontSize={10} tickLine={false} />
                                                    <YAxis type="number" dataKey="y" name="Y" stroke="#64748b" fontSize={10} tickLine={false} />
                                                    <Tooltip contentStyle={{ backgroundColor: '#0f172a', borderColor: '#334155', color: '#f8fafc', fontSize: '12px' }}/>
                                                    {currentScenario.groups.map((g, idx) => (
                                                        <Scatter 
                                                            key={g.id} 
                                                            name={`Subject ${g.id + 1}`} 
                                                            data={currentScenario.data.filter(p => p.groupId === g.id)} 
                                                            fill={['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'][idx]} 
                                                        />
                                                    ))}
                                                </ScatterChart>
                                            </ChartContainer>
                                        </div>
                                    )}

                                    {currentScenario.type === 'NARRATIVE' && (
                                        <div className="h-56 md:h-80 flex items-center justify-center bg-slate-900 border border-slate-700 rounded-lg p-6 md:p-8 mb-4">
                                            <p className="text-base md:text-lg text-slate-300 leading-relaxed font-serif italic text-center">
                                                "{currentScenario.text}"
                                            </p>
                                        </div>
                                    )}

                                    {currentScenario.type === 'HAUSMAN' && (
                                        <div className="h-56 md:h-80 bg-black border border-slate-700 rounded-lg p-4 md:p-6 font-mono text-xs md:text-sm mb-4 flex flex-col justify-center overflow-x-auto">
                                            <p className="text-green-500 mb-2">$ hausman fe re</p>
                                            <p className="text-slate-300 whitespace-pre">       chi2(1) = (b-B)'[(V<sub>b</sub>-V<sub>B</sub>)<sup>-1</sup>](b-B)</p>
                                            <p className="text-slate-300 whitespace-pre">               = {currentScenario.chi2}</p>
                                            <p className="text-yellow-400 font-bold bg-yellow-900/20 inline-block p-1 mt-1">Prob &gt; chi2 = {currentScenario.pValue}</p>
                                        </div>
                                    )}
                                </div>

                                <div className="flex flex-col h-full">
                                     <div className="mb-auto">
                                        <p className="text-[10px] text-slate-500 uppercase tracking-widest mb-2 font-bold">Lifelines</p>
                                        
                                        {currentScenario.type === 'VISUAL' && (
                                            <button onClick={() => useLifeline('HAUSMAN')} disabled={score < 50} className={theme.lifelineBtn}>
                                                <span className="flex items-center gap-2"><Icons.Terminal size={14} className="text-cyan-400"/> Run Hausman Test</span>
                                                <span className="text-cyan-600 font-bold">-50 pts</span>
                                            </button>
                                        )}
                                        
                                        <button onClick={() => useLifeline('ORACLE')} disabled={score < 20 || hintVisible} className={theme.lifelineBtn}>
                                            <span className="flex items-center gap-2"><Icons.HelpCircle size={14} className="text-purple-400"/> Consult Oracle</span>
                                            <span className="text-purple-600 font-bold">-20 pts</span>
                                        </button>
                                        
                                        <button onClick={handleSurrender} className={`${theme.lifelineBtn} hover:bg-red-900/20 hover:border-red-500/50`}>
                                            <span className="flex items-center gap-2"><Icons.Eye size={14} className="text-red-400"/> Surrender & Reveal</span>
                                            <span className="text-red-600 font-bold">-100 pts</span>
                                        </button>

                                        {hintVisible && (
                                            <div ref={hintRef} className={theme.hintPanel}>
                                                <div className="flex items-center gap-2 text-yellow-400 text-xs font-bold uppercase mb-1">
                                                    <Icons.Search size={12} /> Signal Decrypted
                                                </div>
                                                <p className="text-xs text-slate-300 leading-relaxed">
                                                    {currentScenario.type === 'VISUAL' 
                                                        ? (currentScenario.isCorrelated ? "Pattern Detected: Notice how X (Horizontal) tends to separate the colors? That suggests Correlation." : "Pattern Missing: The colors are scattered randomly. X doesn't seem to predict the Group.")
                                                        : currentScenario.hint
                                                    }
                                                </p>
                                            </div>
                                        )}
                                     </div>

                                     <div className="space-y-3 mt-4">
                                        <button onClick={() => makeChoice('FE')} className="w-full group p-4 border border-slate-700 hover:border-cyan-500 bg-slate-800/50 hover:bg-slate-800 rounded-xl transition-all text-left relative overflow-hidden active:bg-slate-800">
                                            <div className="absolute inset-0 bg-cyan-500/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                                            <div className="flex items-center gap-3 mb-1 relative z-10">
                                                <Icons.Lock size={20} className="text-cyan-400"/>
                                                <h3 className="font-bold text-white text-md tracking-wide">FIXED EFFECTS</h3>
                                            </div>
                                            <p className="text-[10px] text-slate-400 relative z-10">Unique intercepts. Rejects H0.</p>
                                        </button>

                                        <button onClick={() => makeChoice('RE')} className="w-full group p-4 border border-slate-700 hover:border-purple-500 bg-slate-800/50 hover:bg-slate-800 rounded-xl transition-all text-left relative overflow-hidden active:bg-slate-800">
                                            <div className="absolute inset-0 bg-purple-500/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                                            <div className="flex items-center gap-3 mb-1 relative z-10">
                                                <Icons.Zap size={20} className="text-purple-400"/>
                                                <h3 className="font-bold text-white text-md tracking-wide">RANDOM EFFECTS</h3>
                                            </div>
                                            <p className="text-[10px] text-slate-400 relative z-10">Random draws. Fails to reject H0.</p>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="text-center py-10 animate-in zoom-in duration-300">
                                <div className={`mx-auto w-24 h-24 rounded-full flex items-center justify-center mb-6 shadow-[0_0_30px_rgba(0,0,0,0.5)] border-4 ${feedback.success ? 'bg-green-900/20 border-green-500 text-green-400' : 'bg-red-900/20 border-red-500 text-red-400'}`}>
                                    {feedback.success ? <Icons.CheckCircle size={48} /> : <Icons.AlertTriangle size={48} />}
                                </div>
                                
                                <h2 className={`text-3xl font-bold mb-2 tracking-tighter ${feedback.success ? 'text-green-400' : 'text-red-400'}`}>
                                    {feedback.title}
                                </h2>
                                
                                <div className="max-w-lg mx-auto mb-8 bg-slate-900 p-4 rounded border border-slate-700 text-left">
                                    <p className="text-xs text-slate-500 uppercase tracking-widest mb-2">Analysis Log:</p>
                                    <p className="text-slate-300 text-sm leading-relaxed font-mono">{feedback.msg}</p>
                                </div>
                                
                                <button onClick={() => { setGameState('playing'); setLevel(l => l+1); }} className={theme.buttonPrimary + " mx-auto"}>
                                    <span className="flex items-center gap-2">Next Simulation <Icons.ChevronRight size={16} /></span>
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // Render the App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
