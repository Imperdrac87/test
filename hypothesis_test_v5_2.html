<!-- REPLACEMENT START -->
<div id="debug-overlay" class="hidden"></div>

<script>
(function(){
  const screens = ['start-screen','guide-screen','battle-screen'];

  function applyTheme(theme){
    if(theme === 'light') document.documentElement.setAttribute('data-theme','light');
    else document.documentElement.removeAttribute('data-theme');

    const btn = document.getElementById('theme-toggle');
    if(btn){
      const label = btn.querySelector('span');
      if(label) label.textContent = theme === 'light' ? 'Switch to Dark' : 'Switch to Light';
    }
  }

  window.toggleTheme = function(){
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
    const next = isLight ? 'dark' : 'light';
    applyTheme(next);
    try{ localStorage.setItem('alpha-theme', next); }catch(e){}
  };

  function initTheme(){
    let saved = null;
    try{ saved = localStorage.getItem('alpha-theme'); }catch(e){}
    if(!saved){
      const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      saved = prefersLight ? 'light' : 'dark';
    }
    applyTheme(saved);
  }

  window.showScreen = function(id){
    screens.forEach(s => { const el = document.getElementById(s); if(el) el.classList.add('hidden'); });
    const target = document.getElementById(id);
    if(target) target.classList.remove('hidden');
    // refresh icons
    if(window.lucide && typeof window.lucide.replace === 'function') window.lucide.replace();
  };  

  window.startGuide = function(){ showScreen('guide-screen'); };

  window.setGuideView = function(mode){
    const btnSplit = document.getElementById('btn-view-split');
    const btnComb = document.getElementById('btn-view-combined');
    if(btnSplit && btnComb){
      if(mode === 'split'){
        btnSplit.classList.add('bg-slate-700','text-white');
        btnComb.classList.remove('bg-slate-700','text-white');
      } else {
        btnComb.classList.add('bg-slate-700','text-white');
        btnSplit.classList.remove('bg-slate-700','text-white');
      }
    }
  };

  // Simple alpha button behaviour: highlight selection and update readout
  document.addEventListener('click', function(e){
    const target = e.target.closest && e.target.closest('.alpha-btn');
    if(target){
      document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('border-red-700','font-bold'));
      target.classList.add('border-red-700','font-bold');
      const val = target.getAttribute('data-alpha');
      const read = document.getElementById('alpha-readout');
      if(read) read.textContent = val;
    }
  }, false);

  // Basic DOM helpers exposed if missing in the page (no-op defaults keep existing logic working)
  window.updateSampleSize = window.updateSampleSize || function(v){ const el=document.getElementById('n-readout'); if(el) el.textContent = v; };
  window.updateEffectSize = window.updateEffectSize || function(v){ const val = (Number(v)/100).toFixed(2); const el=document.getElementById('d-readout'); if(el) el.textContent = val; };
  window.updateGuideParams = window.updateGuideParams || function(v){ const el=document.getElementById('crit-readout'); if(el) el.textContent = v; };
  window.toggleGuideLabels = window.toggleGuideLabels || function(){ /* no-op if not implemented */ };
  window.matrixClick = window.matrixClick || function(h,s){ const title = document.getElementById('explainer-title'); if(title) title.textContent = (h==='h0'?'H₀':'H₁') + ' — ' + (s==='fail'?'Fail to Reject':'Reject'); };
  window.runSamplingSimulation = window.runSamplingSimulation || function(){ const overlay = document.getElementById('simulation-overlay'); if(overlay) overlay.classList.remove('hidden'); setTimeout(()=>overlay.classList.add('hidden'), 600); };

  document.addEventListener('DOMContentLoaded', function(){
    initTheme();
    if(window.lucide && typeof window.lucide.replace === 'function') window.lucide.replace();

    // Apply initial guide view button state
    const btnSplit = document.getElementById('btn-view-split');
    if(btnSplit) btnSplit.classList.add('bg-slate-700','text-white');
  });

})();
</script>

</main>
  </div>
</body>
</html>
