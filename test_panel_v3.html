// --- FIX 2: ERROR BOUNDARY ---
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false };
  }
  static getDerivedStateFromError(error) { return { hasError: true }; }
  componentDidCatch(error, errorInfo) { console.error('Error caught:', error, errorInfo); }
  render() {
    if (this.state.hasError) {
      return (
        <div className="text-center p-8 text-red-400 bg-slate-900 min-h-screen flex flex-col justify-center items-center">
          <h2 className="text-2xl font-bold mb-4">Protocol Malfunction Detected</h2>

      );
    }
    return this.props.children;
  }
}

// --- FIX 8: CONFETTI ENGINE (FIXED MEMORY LEAK) ---
const FireConfetti = () => {
    // Clean up previous canvas if it exists
    let existingCanvas = document.getElementById('confetti-canvas');
    if (existingCanvas) {
        existingCanvas.remove();
        existingCanvas = null;
    }

    const canvas = document.createElement('canvas');
    canvas.id = 'confetti-canvas';
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const particles = [];
    const colors = ['#06b6d4', '#8b5cf6', '#f59e0b', '#10b981', '#ef4444'];

    for (let i = 0; i < 150; i++) {
        particles.push({
            x: window.innerWidth / 2,
            y: window.innerHeight / 2,
            vx: (Math.random() - 0.5) * 20,
            vy: (Math.random() - 0.5) * 20,
            life: 100 + Math.random() * 50,
            color: colors[Math.floor(Math.random() * colors.length)],
            size: Math.random() * 8 + 4
        });
    }

    const animate = () => {
        if (!document.body.contains(canvas)) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;
        particles.forEach(p => {
            if (p.life > 0) {
                active = true;
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2; // Gravity
                p.life--;
                p.size *= 0.99;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            }
        });
        if (active) requestAnimationFrame(animate);
        else canvas.remove();
    };
    animate();

    // Safety cleanup
    setTimeout(() => {
        if (document.body.contains(canvas)) canvas.remove();
    }, 5000);
};

// --- FIX 4: SOUND MANAGER (SINGLETON PATTERN) ---
let audioContextInstance = null;
const getAudioContext = () => {
    if (!audioContextInstance) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return null;
        audioContextInstance = new AudioCtx();
    }
    if (audioContextInstance.state === 'suspended') {
        audioContextInstance.resume();
    }
    return audioContextInstance;
};

const playTone = (frequency, duration, ctx) => {
    try {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = frequency;
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + duration);
    } catch(e) { console.warn(e); }
};

{ id: 'within_between', title: 'Within vs Between Variation', content: `WITHIN: How does Y change for the SAME unit as X changes over time? (FE exploits this). BETWEEN: How do units DIFFER in average Y and X? (RE exploits this). If you only care about differences *across* countries, FE might kill your variation.`, icon: 'Activity', color: 'cyan' },
{ id: 'hausman_deep', title: 'Hausman Test Intuition', content: `Think of FE as "Consistent but Expensive" and RE as "Efficient but Risky". The Hausman test asks: "Are the FE and RE estimates significantly different?" If YES (p < 0.05), the risky RE assumption failed → Use FE. If NO (p > 0.05), both work → Use RE (it's cheaper/efficient).`, icon: 'Scale', color: 'yellow' },
{ id: 'heterogeneity', title: 'Unobserved Heterogeneity', content: `Variables that differ between units but stay constant over time (like 'Culture', 'Genetics', 'Brand Reputation'). If these affect your X variable, you have an endogeneity problem that FE can solve.`, icon: 'Eye', color: 'purple' },
{ id: 'simultaneity', title: 'Simultaneity (Reverse Causality)', content: `When X causes Y, but Y also causes X. E.g., More Police -> Less Crime, but High Crime -> More Police. This creates a loop that biases standard regressions. You need Instrumental Variables (IV) or natural experiments.`, icon: 'RefreshCw', color: 'blue' },
{ id: 'time_shocks', title: 'Time Fixed Effects (Global Shocks)', content: `Events that hit EVERY unit at the same time (e.g., 2008 Crisis, Covid-19, National Laws). If you don't control for Time (Time Dummies), you might mistake a global trend for a specific effect.`, icon: 'Clock', color: 'orange' },
{ id: 'dynamics', title: 'Dynamic Panels (Inertia)', content: `When your current status depends on your past status (e.g., Smoking, Employment, Wealth). Using standard FE with a lagged dependent variable creates "Nickell Bias" in short panels. You need GMM estimators (Arellano-Bond).`, icon: 'Zap', color: 'pink' }
];

// --- FIX 11: DATA GENERATION (Seeded Variability - Enhanced for Clarity) ---
const generatePanelData = (nGroups, tPeriods, correlated, seed = Math.random()) => {
    const data = [];
    const groups = [];
    
    // Define a slope for the individual regressions
    const beta = 1.5; 

    for (let i = 0; i < nGroups; i++) {
        // Seeded random for consistency
        const pseudoRandom = Math.sin(seed * 12.9898 + i * 78.233) * 43758.5453;
        const normalizedRandom = (pseudoRandom % 1 + 1) % 1; // 0 to 1

        // 1. Assign a distinct average X for this group
        const groupMeanX = 2 + (normalizedRandom * 12); 

        let groupEffect;
        if (correlated) {
            // FE: STRONG POSITIVE CORRELATION
            // Groups with higher X mean get strictly higher intercepts
            // This creates a distinct "diagonal ladder" visual pattern
            groupEffect = (groupMeanX - 8) * 4; 
        } else {
            // RE: RANDOM SCATTER
            // Intercepts are completely independent of X position
            // Use a different seed component to ensure orthogonality
            const effectRandom = Math.sin(seed * i * 99.99 + 123.45); 
            groupEffect = (effectRandom * 20); // Large variance to show scatter
        }
        
        groups.push({ 
            id: i, 
            name: `Subject_${(i+1).toString().padStart(2, '0')}`, 
            effect: groupEffect,
            meanX: groupMeanX 
        });
    }

    groups.forEach(group => {
        for (let t = 0; t < tPeriods; t++) {
            // X is centered around the group mean with some variation
            const x = group.meanX + (Math.random() * 3 - 1.5); 
            
            // Random noise epsilon
            const epsilon = (Math.random() * 3) - 1.5;

            // Y = Beta*X + Alpha_i + Epsilon
            const y = (beta * x) + group.effect + epsilon;

            data.push({
                groupId: group.id,
                name: group.name,
                x: parseFloat(x.toFixed(2)),
                y: parseFloat(y.toFixed(2)),
            });
        }
    });

    return { data, groups };
};

const generateTimeSeriesData = (hasShock) => {
    const data = [];
    for (let t = 0; t < 10; t++) {
        const shock = hasShock && t >= 5 ? -15 : 0;
        data.push({
            time: t,
            g1: 10 + t * 2 + shock + Math.random() * 2,
            g2: 15 + t * 2 + shock + Math.random() * 2,
            g3: 20 + t * 2 + shock + Math.random() * 2
        });
    }
    return data;
};

// --- FIX FOR UNDEFINED SCENARIOS ---
const buildScenarioFromBlueprint = (blueprint, module) => {
    // Safety check for blueprint
    if (!blueprint) return { type: 'ERROR', text: "Protocol Complete", options: [] };
    
    // 1. Handle Generative Types (VISUAL / HAUSMAN) FIRST
    // These do NOT need a database ID lookup
    if (blueprint.type === 'VISUAL' && module === 'fe_re') {
        const isCorrelated = blueprint.isCorrelated;
        return {
            ...generatePanelData(5, 8, isCorrelated),
            type: 'VISUAL',
            question: "Scan the data. Does group identity appear related to X (horizontal)?",
            logic: isCorrelated ? "Groups separate along X: this suggests unit effects are correlated with X → RE is biased → choose FE." : "Colors are mixed: X shows no systematic relation to group identity → RE assumption is plausible.",
            correctModel: isCorrelated ? 'FE' : 'RE',
            isCorrelated,
            objective: blueprint.objective,
            concept: blueprint.concept,
            options: [{label: 'Fixed Effects', value: 'FE'}, {label: 'Random Effects', value: 'RE'}]
        };
    }
    
    if (blueprint.type === 'HAUSMAN' && module === 'fe_re') {
        const isCorrelated = blueprint.isCorrelated;
        const pValue = isCorrelated ? (Math.random() * 0.04).toFixed(4) : (0.10 + Math.random() * 0.8).toFixed(4);
        const chi2 = isCorrelated ? (20 + Math.random() * 50).toFixed(2) : (Math.random() * 2).toFixed(2);
        return {
            type: 'HAUSMAN',
            pValue,
            chi2,
            question: "Interpret the Hausman Test result.",
            hint: isCorrelated ? "P < 0.05 → reject RE." : "P > 0.05 → keep RE.",
            logic: isCorrelated ? `P-value (${pValue}) < 0.05 → reject Null → RE inconsistent → use FE.` : `P-value (${pValue}) > 0.05 → fail to reject Null → RE is plausible.`,
            correctModel: isCorrelated ? 'FE' : 'RE',
            isCorrelated,
            objective: blueprint.objective,
            concept: blueprint.concept,
            options: [{label: 'Fixed Effects', value: 'FE'}, {label: 'Random Effects', value: 'RE'}]
        };
    }

    // 2. Handle Narrative Types (Database Lookup)
    let db = SCENARIO_DB_MOD1;
    if (module === 'concepts') db = SCENARIO_DB_MOD2;
    if (module === 'dynamics') db = SCENARIO_DB_MOD3;

    // Safety check for DB
    if (!db) return { type: 'ERROR', text: "Module Database Not Found", options: [] };

    const scenario = db.find(s => s.id === blueprint.narrativeId);
    
    // Safety check if scenario ID not found in DB
    if (!scenario) {
        return { 
            type: 'ERROR', 
            text: `Scenario data missing for ID: ${blueprint.narrativeId}`, 
            options: [] 
        };
    }
    
    return { ...scenario, objective: blueprint.objective };
};

// --- GAME ENGINE (RESTORED) ---
const GameMode = ({ onQuit, achievements, unlockAchievement, module }) => {
    const [level, setLevel] = useState(1);
    const [score, setScore] = useState(STARTING_SCORE);
    const [streak, setStreak] = useState(0);
    const [gameState, setGameState] = useState('playing');
    const [currentScenario, setCurrentScenario] = useState(null);
    const [feedback, setFeedback] = useState(null);
    const [timeLeft, setTimeLeft] = useState(30);
    const [timerActive, setTimerActive] = useState(true);
    const [hintVisible, setHintVisible] = useState(false);
    const [isRevealModalOpen, setIsRevealModalOpen] = useState(false);
    const [gameHistory, setGameHistory] = useState([]);
    const [perfectLevel, setPerfectLevel] = useState(true);
    const [shakeAnimation, setShakeAnimation] = useState(false);
    const [showTutorial, setShowTutorial] = useState(true);

    // Determine curriculum based on selected module
    let curriculum = CURRICULUM_MOD1;
    if (module === 'concepts') curriculum = CURRICULUM_MOD2;
    if (module === 'dynamics') curriculum = CURRICULUM_MOD3;

    // --- FIX 15: DEBUG LOGGING ---
    useEffect(() => {
        log('Game state changed', { gameState, level, score });
    }, [gameState, level, score]);

    useEffect(() => {
        if (gameState === 'playing') {
            if (level > curriculum.length) { setGameState('gameover'); return; }
            const blueprint = curriculum[level - 1];
            if (!blueprint) { setGameState('gameover'); return; }
            const newScenario = buildScenarioFromBlueprint(blueprint, module);
            setCurrentScenario(newScenario);
            setTimeLeft(30);
            setTimerActive(true);
            setHintVisible(false);
            setIsRevealModalOpen(false);
            setPerfectLevel(true);
        }
    }, [gameState, level, module]);

    // --- FIX 7: TIMER ACCURACY & CLEANUP ---
    const handleTimerDecrement = useCallback(() => {
        setTimeLeft(prev => {
            if (prev <= 1) {
                setTimerActive(false);
                return 0;
            }
            return prev - 1;
        });
    }, []);

    useEffect(() => {
        if (!timerActive || gameState !== 'playing' || showTutorial) return;
        const interval = setInterval(handleTimerDecrement, 1000);
        return () => clearInterval(interval);
    }, [timerActive, gameState, showTutorial, handleTimerDecrement]);

    // Trigger timeout when timeLeft hits 0 (separate effect to avoid closure staleness)
    useEffect(() => {
        if (timeLeft === 0 && timerActive && gameState === 'playing' && !showTutorial) {
            handleAnswer('TIMEOUT');
        }
    }, [timeLeft, timerActive, gameState, showTutorial]);

    // --- FIX 5: CLEANUP FOR GAMEOVER ---
    useEffect(() => {
        if (gameState === 'gameover') { 
            FireConfetti(); 
            SoundManager.achievement(); 
        }
    }, [gameState]);

    const handleAnswer = (choice) => {
        if (!currentScenario || gameState !== 'playing') return;
        
        log('Answer submitted', { choice, correctAnswer: currentScenario.correctModel });

        setTimerActive(false);
        const isCorrect = choice === currentScenario.correctModel;
        const isTimeout = choice === 'TIMEOUT';
        let points = isCorrect && !isTimeout ? 50 + (timeLeft * 2) + (streak * 10) : -30;
        let newStreak = isCorrect && !isTimeout ? streak + 1 : 0;
        
        if (isCorrect && !isTimeout) {
            if (newStreak === 1 && gameHistory.length === 0) unlockAchievement('first_correct');
            if (newStreak === 3) unlockAchievement('streak_3');
            if (newStreak === 5) unlockAchievement('streak_5');
            if (perfectLevel) unlockAchievement('perfectionist');
            newStreak >= 3 ? SoundManager.streak() : SoundManager.correct();
        } else {
            SoundManager.wrong();
            setShakeAnimation(true);
            setTimeout(() => setShakeAnimation(false), 500);
        }

        const newScore = Math.max(0, score + points);
        const conceptInfo = PROFESSOR_NOTES[currentScenario.concept] || PROFESSOR_NOTES.OVB;
        
        setGameHistory(prev => [...prev, { level, isCorrect, points }]);
        setScore(newScore);
        setStreak(newStreak);
        
        // Show feedback without auto-advance
        setFeedback({
            isCorrect, isTimeout, points,
            correctAnswer: currentScenario.correctModel,
            conceptTitle: conceptInfo.title,
            conceptText: conceptInfo.text,
            explanation: currentScenario.logic || "Analysis complete."
        });
    };

    // --- FIX 10: LEVEL PROGRESSION EDGE CASE ---
    const handleNextLevel = () => {
        setFeedback(null);
        // Safety check: if score depleted or no more levels
        if (score <= 0 || level >= curriculum.length) {
            setGameState('gameover');
        } else {
            setLevel(prev => prev + 1);
        }
    };

    // --- RENDERERS ---
    if (gameState === 'gameover') {
        const finalGrade = score >= 250 ? 'A+' : score >= 150 ? 'A' : score >= 100 ? 'B' : 'C';
        if (finalGrade === 'A+') unlockAchievement('master');
        if (module === 'fe_re') unlockAchievement('analyst');
        if (module === 'concepts') unlockAchievement('detective');
        if (module === 'dynamics') unlockAchievement('time_lord');

        return (
            <div className={`${theme.container} pt-12 animate-in text-center`}>
                <div className="max-w-2xl mx-auto">
                    <Icons.Trophy size={64} className="mx-auto mb-4 text-yellow-400 floating drop-shadow-[0_0_15px_rgba(234,179,8,0.8)]" />
                    <h1 className="text-4xl font-bold text-white mb-2">SIMULATION COMPLETE</h1>
                    <div className={theme.card + " mt-8"}>
                        <div className="grid grid-cols-2 gap-6 mb-6">
                            <div><div className="text-3xl font-bold text-cyan-400">{score}</div><div className="text-xs text-slate-400">SCORE</div></div>
                            <div><div className="text-3xl font-bold text-purple-400">{finalGrade}</div><div className="text-xs text-slate-400">GRADE</div></div>
                        </div>
                        <button onClick={onQuit} className={theme.buttonPrimary}>Return to Hub <Icons.ArrowRight size={16} /></button>
                    </div>
                </div>
            </div>
        );
    }

    if (feedback) {
        return (
            <div className={`${theme.container} pt-12 animate-in text-center`}>
                <div className="max-w-2xl mx-auto">
                    {feedback.isCorrect ? 
                        <Icons.CheckCircle size={80} className="mx-auto mb-4 text-green-400 animate-bounce drop-shadow-[0_0_15px_rgba(74,222,128,0.8)]" /> : 
                        <Icons.XCircle size={80} className="mx-auto mb-4 text-red-400 animate-shake drop-shadow-[0_0_15px_rgba(248,113,113,0.8)]" />
                    }
                    <h1 className="text-3xl font-bold text-white mb-6 tracking-widest">{feedback.isCorrect ? "CORRECT DIAGNOSIS" : "DIAGNOSIS FAILED"}</h1>
                    
                    <div className="bg-slate-900/90 p-6 rounded-lg text-left border-2 border-cyan-500 shadow-[0_0_30px_rgba(6,182,212,0.2)] mb-8">
                        <div className="flex items-center gap-2 mb-3 text-yellow-400">
                            <Icons.BookOpen size={20}/>
                            <span className="font-bold text-sm uppercase tracking-widest">Professor's Note: {feedback.conceptTitle}</span>
                        </div>
                        <p className="text-slate-200 text-sm leading-relaxed mb-4 border-l-2 border-yellow-500 pl-4">{feedback.conceptText}</p>
                        <div className="text-xs text-cyan-400 italic bg-cyan-900/20 p-2 rounded">Case Logic: {feedback.explanation}</div>
                    </div>

                    <button onClick={handleNextLevel} className={theme.buttonPrimary + " w-full md:w-2/3 mx-auto text-lg py-4"}>
                        {level >= curriculum.length ? "Finish Simulation" : "Next Mission"} <Icons.ArrowRight size={20}/>
                    </button>
                </div>
            </div>
        );
    }

    if (!currentScenario) return <div className="text-center pt-20 text-cyan-500 font-bold animate-pulse">Initializing Protocol...</div>;

    return (
        <div className={`${theme.container} pt-8 animate-in relative ${shakeAnimation ? 'animate-shake' : ''}`}>
            {showTutorial && <TutorialOverlay onDismiss={() => setShowTutorial(false)} />}
            
            <div className="flex justify-between items-center mb-6">
                <button onClick={onQuit} className={theme.buttonSecondary}><Icons.ChevronRight className="rotate-180" size={16} /> Abort</button>
                <div className="text-center"><div className="text-xl font-bold text-white">Lvl {level}</div><div className="text-xs text-cyan-400">{module === 'fe_re' ? 'Protocol Alpha' : module === 'concepts' ? 'Protocol Beta' : 'Protocol Gamma'}</div></div>
                <div className="text-right"><div className="text-xl font-bold text-cyan-400">{score}</div><div className="text-xs text-slate-400">PTS</div></div>
            </div>

            <div id="timer-deck" className="flex justify-between items-center mb-6 p-4 bg-slate-900/50 rounded-lg border border-slate-700 shadow-inner">
                <div className="flex items-center gap-4">
                    <div className="flex items-center gap-2"><Icons.Clock size={16} className={timeLeft <= 10 ? "text-red-400 animate-pulse" : "text-cyan-400"} /><span className={`font-mono text-lg ${timeLeft <= 10 ? 'text-red-400' : 'text-white'}`}>{timeLeft}s</span></div>
                    {streak > 0 && <div className="flex items-center gap-2"><Icons.Flame size={16} className="text-orange-400 animate-pulse" /><span className="font-mono text-lg text-orange-400">{streak}</span></div>}
                </div>
                <div className="w-1/3"><ProgressBar current={level - 1} total={curriculum.length} label="" /></div>
            </div>

            <div id="scenario-deck" className={theme.card}>
                <h2 className="text-xl font-bold text-white mb-4 flex items-center gap-2">
                    {currentScenario.type === 'VISUAL' ? <Icons.Activity size={20} className="text-cyan-400"/> : <Icons.Terminal size={20} className="text-purple-400"/>}
                    {currentScenario.type === 'NARRATIVE' ? 'Scenario Analysis' : currentScenario.type === 'VISUAL' ? 'Pattern Recognition' : 'Statistical Test'}
                </h2>
                
                {currentScenario.type === 'NARRATIVE' && <div className="bg-slate-800/50 p-6 rounded-lg border border-slate-700 mb-4"><p className="text-slate-200 leading-relaxed text-sm md:text-base font-medium">{currentScenario.text}</p></div>}
                
                {currentScenario.type === 'VISUAL' && <ChartContainer title="Panel Visualization"><ScatterChart margin={{ top: 20, right: 20, bottom: 20, left: 0 }}><CartesianGrid strokeDasharray="3 3" stroke="#334155" /><XAxis type="number" dataKey="x" stroke="#94a3b8" tickLine={false} /><YAxis type="number" dataKey="y" stroke="#94a3b8" tickLine={false} />
                {/* FIX 1: TOOLTIP STYLING */}
                <Tooltip contentStyle={{ backgroundColor: '#0f172a', borderColor: '#06b6d4', color: '#f8fafc', borderRadius: '6px', maxWidth: '200px' }} formatter={(value) => value?.toFixed(2)}/>
                {currentScenario.groups.map((g, idx) => (<Scatter key={g.id} name={g.name} data={currentScenario.data.filter(d => d.groupId === g.id)} fill={getColor(idx)} shape="circle" />))}</ScatterChart></ChartContainer>}
                
                {currentScenario.type === 'HAUSMAN' && <div className="bg-black border-2 border-slate-700 rounded-lg p-6 font-mono text-sm mb-4 shadow-inner"><p className="text-green-500 mb-2">$ hausman fixed random</p><p className="text-slate-200 text-xs mb-4">chi2(1) = {currentScenario.chi2}</p><div className="bg-yellow-900/30 border border-yellow-500/50 p-4 rounded text-center"><p className="text-yellow-500 font-bold text-lg">Prob &gt; chi2 = {currentScenario.pValue}</p></div></div>}
                
                {hintVisible && currentScenario.hint && <div className={theme.hintPanel}><div className="flex items-center gap-2 mb-2"><Icons.HelpCircle size={16} className="text-yellow-400" /><span className="text-yellow-400 font-bold text-xs uppercase tracking-widest">Analysis Hint</span></div><p className="text-yellow-200 text-sm">{currentScenario.hint}</p></div>}
            </div>

            {/* FIX 6 & 13: RESPONSIVE & ACCESSIBLE BUTTONS */}
            <div id="control-deck" className={`grid gap-4 mb-6 ${currentScenario.options?.length > 2 ? 'grid-cols-1 md:grid-cols-2' : 'grid-cols-2'}`}>
                {currentScenario.options?.map((opt, idx) => (
                    <button 
                        key={idx} 
                        onClick={() => handleAnswer(opt.value)} 
                        aria-label={`Select ${opt.label} as your answer`}
                        className={`p-6 bg-slate-800/80 hover:bg-slate-700 border-2 ${idx % 2 === 0 ? 'border-cyan-500/30 hover:border-cyan-400' : 'border-purple-500/30 hover:border-purple-400'} rounded-lg transition-all text-center group active:scale-95 flex flex-col items-center justify-center h-full shadow-lg hover:shadow-xl relative overflow-hidden`}
                    >
                        <div className={`absolute inset-0 opacity-0 group-hover:opacity-10 transition-opacity ${idx % 2 === 0 ? 'bg-cyan-400' : 'bg-purple-400'}`}></div>
                        <div className="font-bold text-sm md:text-lg mb-1 text-white relative z-10">{opt.label}</div>
                    </button>
                ))}
            </div>

            <div id="lifeline-deck" className="border-t border-slate-700 pt-6">
                <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                    <button onClick={() => { setHintVisible(true); setScore(s => Math.max(0, s-15)); setPerfectLevel(false); }} disabled={hintVisible} className={theme.lifelineBtn}>Hint <span className="text-red-400">-15</span></button>
                    <button onClick={() => { setIsRevealModalOpen(true); setScore(s => Math.max(0, s-40)); setPerfectLevel(false); }} disabled={isRevealModalOpen} className={theme.lifelineBtn}>Reveal <span className="text-red-400">-40</span></button>
                </div>
            </div>

            {/* FIX 9: REVEAL MODAL VISIBILITY & ACCESSIBILITY */}
            {isRevealModalOpen && (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-in" role="dialog" aria-modal="true">
                    <div className="bg-slate-900 border-2 border-cyan-500 rounded-xl p-6 max-w-md w-full shadow-[0_0_50px_rgba(6,182,212,0.4)] animate-in">
                        <div className="text-xs text-cyan-400 mb-2 uppercase tracking-widest font-bold">Solution Override</div>
                        <div className="text-xl font-bold text-white mb-3">{currentScenario.options.find(o => o.value === currentScenario.correctModel)?.label}</div>
                        <p className="text-slate-300 text-sm border-t border-slate-700 pt-2">{currentScenario.logic}</p>
                        <button onClick={() => setIsRevealModalOpen(false)} className={theme.buttonPrimary + " w-full mt-4"}>Close</button>
                    </div>
                </div>
            )}
        </div>
    );
};

// --- APP ROOT ---
const App = () => {
    const [phase, setPhase] = useState('hub');
    const [selectedModule, setSelectedModule] = useState(null);
    const [achievements, setAchievements] = useState(ACHIEVEMENTS);
    const [showAchievement, setShowAchievement] = useState(null);
    
    // --- FIX 12: LOCAL STORAGE PERSISTENCE (Initial Load) ---
    useEffect(() => {
      const saved = localStorage.getItem('sigma_labs_progress');
      if (saved) {
        try {
          const data = JSON.parse(saved);
          if (new Date() - new Date(data.timestamp) < 86400000) { // 24 hours
             if (data.achievements) setAchievements(data.achievements);
          }
        } catch(e) { console.warn("Load failed", e); }
      }
    }, []);

    // --- FIX 12: LOCAL STORAGE PERSISTENCE (Save) ---
    useEffect(() => {
        const gameData = { achievements, timestamp: new Date().toISOString() };
        localStorage.setItem('sigma_labs_progress', JSON.stringify(gameData));
    }, [achievements]);

    const unlockAchievement = useCallback((id) => {
        setAchievements(prev => {
            if (prev.find(a => a.id === id && a.unlocked)) return prev;
            const updated = prev.map(a => a.id === id ? { ...a, unlocked: true } : a);
            const ach = updated.find(a => a.id === id);
            setShowAchievement(ach);
            return updated;
        });
    }, []);

    // --- FIX 14: MODULE NAVIGATION STATE RESET ---
    const handleModuleSelect = (mod) => {
        setSelectedModule(mod);
        setPhase('lab');
    };

    return (
        <ErrorBoundary>
            <div className={theme.bg}>
                {showAchievement && <AchievementNotification achievement={showAchievement} onClose={() => setShowAchievement(null)} />}
                
                {phase === 'hub' && <MainMenu onSelectModule={handleModuleSelect} achievements={achievements} />}
                
                {phase === 'lab' && <LabMode onComplete={() => setPhase('game')} module={selectedModule} />}
                
                {phase === 'game' && <GameMode 
                    onQuit={() => setPhase('hub')} 
                    achievements={achievements} 
                    unlockAchievement={unlockAchievement}
                    module={selectedModule}
                />}
            </div>
        </ErrorBoundary>
    );
};

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
