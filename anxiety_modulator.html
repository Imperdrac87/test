<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindful Calm</title>
    <!-- Using a more futuristic font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        /* CSS styles for a futuristic theme */
        :root {
            --anxious-color: #ff3b3b; /* A glowing, alert red */
            --calm-color: #00f0ff;    /* A tranquil, electric cyan */
            --bg-color: #12121c;      /* Deep space blue/charcoal */
            --text-color: #e0e0e0;
            --container-bg: rgba(28, 38, 54, 0.6);
            --container-border: rgba(0, 240, 255, 0.3);
            --thumb-glow-color: #ffffff;
        }

        body {
            margin: 0;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.8s ease;
            overflow: hidden;
        }

        /* Adding a subtle animated grid background */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.5;
            z-index: -1;
            animation: pan-grid 60s linear infinite;
        }

        @keyframes pan-grid {
            0% { background-position: 0 0; }
            100% { background-position: 400px 400px; }
        }

        .container {
            text-align: center;
            background-color: var(--container-bg);
            padding: 30px 40px;
            border-radius: 10px;
            border: 1px solid var(--container-border);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.1), inset 0 0 10px rgba(0, 240, 255, 0.1);
            width: 90%;
            max-width: 500px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        h1 {
            font-weight: 700;
            font-size: 2.5em;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--calm-color); /* This will be updated by JS */
            text-shadow: 0 0 10px var(--calm-color); /* This will be updated by JS */
            transition: color 0.5s ease, text-shadow 0.5s ease;
        }

        .instruction {
            font-weight: 300;
            margin-bottom: 30px;
            font-size: 1.1em;
            color: var(--text-color);
        }

        .slider-container {
            position: relative;
            width: 100%;
            margin: 20px 0;
        }

        .slider-value {
            font-size: 3em;
            font-weight: 500;
            color: var(--text-color);
            margin-bottom: 15px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        .slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, var(--calm-color) 0%, var(--anxious-color) 100%);
            outline: none;
            border-radius: 3px;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            background: var(--thumb-glow-color);
            cursor: pointer;
            border-radius: 50%;
            border: none;
            box-shadow: 0 0 15px var(--thumb-glow-color), 0 0 25px var(--dynamic-glow-color);
            transition: box-shadow .2s ease;
        }
        
        .slider:hover::-webkit-slider-thumb {
             box-shadow: 0 0 20px var(--thumb-glow-color), 0 0 35px var(--dynamic-glow-color);
        }

        .slider::-moz-range-thumb {
            width: 24px;
            height: 24px;
            background: var(--thumb-glow-color);
            cursor: pointer;
            border-radius: 50%;
            border: none;
            box-shadow: 0 0 15px var(--thumb-glow-color), 0 0 25px var(--dynamic-glow-color);
            transition: box-shadow .2s ease;
        }

        .label-left, .label-right {
            display: inline-block;
            width: 48%;
            font-size: 1em;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .label-left { text-align: left; color: var(--calm-color); }
        .label-right { text-align: right; color: var(--anxious-color); }

        .calm-message {
            color: var(--calm-color);
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            font-weight: 500;
            font-size: 1.1em;
            margin-top: 20px;
            height: 20px; /* Reserve space to prevent layout shift */
            text-shadow: 0 0 5px var(--calm-color);
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Mindful Calm</h1>
        <p class="instruction">Take a deep breath. Slowly guide the slider down to lower the energy and find your calm.</p>
        <div class="slider-container">
            <input type="range" min="0" max="100" value="75" class="slider" id="calmnessSlider">
            <div id="sliderValue" class="slider-value">75</div>
        </div>
        <p class="label-left">Calm</p>
        <p class="label-right">High Anxiety</p>
        <p id="calmMessage" class="calm-message">Well done. Rest here for a moment.</p>
    </div>

    <script>
        const slider = document.getElementById('calmnessSlider');
        const sliderValue = document.getElementById('sliderValue');
        const h1 = document.querySelector('h1');
        const root = document.documentElement;
        const calmMessage = document.getElementById('calmMessage');

        const mapRange = (value, in_min, in_max, out_min, out_max) => {
            return (value - in_min) * (out_max - out_min) / (in_max - in_min) + out_min;
        };

        const interpolateColor = (value) => {
            const r_anxious = 255, g_anxious = 59, b_anxious = 59;
            const r_calm = 0, g_calm = 240, b_calm = 255;
            
            const r = mapRange(value, 0, 100, r_calm, r_anxious);
            const g = mapRange(value, 0, 100, g_calm, g_anxious);
            const b = mapRange(value, 0, 100, b_calm, b_anxious);

            return `rgb(${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)})`;
        };
        
        const updateTheme = (value) => {
            const currentColor = interpolateColor(value);
            
            h1.style.color = currentColor;
            h1.style.textShadow = `0 0 10px ${currentColor}`;
            
            root.style.setProperty('--dynamic-glow-color', currentColor);
        };

        // Initialize display with the default value
        sliderValue.textContent = slider.value;
        updateTheme(slider.value);

        // Add event listener for slider input
        slider.addEventListener('input', () => {
            sliderValue.textContent = slider.value;
            updateTheme(slider.value);

            // Show or hide the calm message based on the slider's position
            if (slider.value == 0) {
                calmMessage.style.opacity = 1;
            } else {
                calmMessage.style.opacity = 0;
            }
        });
    </script>
</body>
</html>
