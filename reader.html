<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Serenity Speaker</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>

  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background-color: #d1d5db; border-radius: 20px; }
    .dark ::-webkit-scrollbar-thumb { background-color: #4b5563; }
    input[type="range"] { -webkit-appearance:none; appearance:none; width:100%; background:transparent; cursor:pointer; }
    input[type="range"]::-webkit-slider-runnable-track { height:6px; background:#e5e7eb; border-radius:3px; }
    .dark input[type="range"]::-webkit-slider-runnable-track { background:#374151; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; margin-top:-5px; height:16px; width:16px; background:#3b82f6; border-radius:50%; }
    .dark input[type="range"]::-webkit-slider-thumb { background:#60a5fa; }
    .sidebar-transition { transition: transform .3s ease-in-out, opacity .3s ease-in-out; }
    .focus-mode .sidebar { transform: translateX(100%); opacity:0; pointer-events:none; }
    .focus-mode .main-content { padding-right: 2rem; }
    .tooltip-container { position:relative; display:inline-flex; }
    .tooltip-container.block { display:block; }
    .tooltip-text { visibility:hidden; width:160px; background:#1f2937; color:#fff; text-align:center; border-radius:6px; padding:8px; position:absolute; z-index:1; bottom:125%; left:50%; margin-left:-80px; opacity:0; transition:opacity .3s; font-size:.75rem; line-height:1.25; }
    .tooltip-container:hover .tooltip-text { visibility:visible; opacity:1; }
    #current-sentence { transition: opacity .4s ease-in-out; }
    .label-row { display:flex; justify-content:space-between; align-items:center; }
  </style>
  <script> tailwind.config = { darkMode: 'class' } </script>
</head>
<body class="bg-slate-100 dark:bg-gray-900 text-slate-800 dark:text-slate-200 transition-colors duration-300">
  <div id="app"></div>

  <script>
    const { useState, useEffect, useRef, useCallback } = React;
    const e = React.createElement;

    // Icons
    const Icon = ({ size = 24, className, children }) => e('svg', { xmlns: "http://www.w3.org/2000/svg", width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", className }, children);
    const SunIcon = (props) => e(Icon, props, e('circle', { cx: 12, cy: 12, r: 4 }), e('path', { d: "M12 2v2" }), e('path', { d: "M12 20v2" }), e('path', { d: "m4.93 4.93 1.41 1.41" }), e('path', { d: "m17.66 17.66 1.41 1.41" }), e('path', { d: "M2 12h2" }), e('path', { d: "M20 12h2" }), e('path', { d: "m4.93 19.07 1.41-1.41" }), e('path', { d: "m17.66 6.34 1.41-1.41" }));
    const MoonIcon = (props) => e(Icon, props, e('path', { d: "M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" }));
    const PlayIcon = (props) => e(Icon, props, e('polygon', { points: "6 3 20 12 6 21 6 3" }));
    const PauseIcon = (props) => e(Icon, props, e('rect', { x: 14, y: 4, width: 4, height: 16, rx: 1 }), e('rect', { x: 6, y: 4, width: 4, height: 16, rx: 1 }));
    const StopIcon = (props) => e(Icon, props, e('rect', { width: 18, height: 18, x: 3, y: 3, rx: 2 }));
    const RestartIcon = (props) => e(Icon, props, e('path', {d: "M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"}), e('path', {d: "M21 3v5h-5"}));
    const MaximizeIcon = (props) => e(Icon, props, e('path', {d: "M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"}));
    const MinimizeIcon = (props) => e(Icon, props, e('path', {d: "M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"}));
    const RewindIcon = (props) => e(Icon, props, e('polygon', { points: "11 19 2 12 11 5 11 19" }), e('polygon', { points: "22 19 13 12 22 5 22 19" }));
    const FastForwardIcon = (props) => e(Icon, props, e('polygon', { points: "13 19 22 12 13 5 13 19" }), e('polygon', { points: "2 19 11 12 2 5 2 19" }));

    const Tooltip = ({ children, text, isBlock = false }) => {
      const className = `tooltip-container ${isBlock ? 'block' : ''}`;
      return e('div', { className }, children, e('span', { className: 'tooltip-text' }, text));
    };

    const presets = {
      'Breathing': "Welcome. Find a comfortable position. ... Close your eyes gently. ... Bring your awareness to your breath. ... Notice the sensation of the air entering your nostrils, and leaving your body. ... Inhale deeply, filling your lungs. ... Hold for a moment. ... Exhale slowly, releasing all tension. ... Continue this pattern. Inhale calm. ... Exhale stress. ... You are present. ... You are at peace.",
      'Body Scan': "Begin by bringing your awareness to your feet. ... Notice any sensations. Warmth, coolness, or tingling. ... Slowly move your attention up to your ankles, calves, and knees, simply observing without judgment. ... Now, bring your focus to your thighs and hips. Let go of any tightness you find. ... Move your awareness to your stomach and chest. Feel the gentle rise and fall with each breath. ... Finally, bring your attention to your arms, hands, neck, and face. ... Allow your entire body to feel heavy and relaxed. ... Rest in this state of peaceful awareness."
    };

    const App = () => {
      const [isDarkMode, setIsDarkMode] = useState(false);
      const [isFocusMode, setIsFocusMode] = useState(false);
      const [text, setText] = useState('');
      const [currentSentence, setCurrentSentence] = useState("Press 'Play' to begin...");

      const [voices, setVoices] = useState([]);
      const [selectedVoice, setSelectedVoice] = useState('');
      const [baseRate, setBaseRate] = useState(0.8);
      const [basePitch, setBasePitch] = useState(1);

      const [clarity, setClarity] = useState(0.5);
      const [pauseIntensity, setPauseIntensity] = useState(0.5);

      const [isSpeaking, setIsSpeaking] = useState(false);
      const [isPaused, setIsPaused] = useState(false);
      const [progress, setProgress] = useState(0);
      const [progressText, setProgressText] = useState("0 / 0");

      const [ambientSound, setAmbientSound] = useState('none');
      const [ambientVolume, setAmbientVolume] = useState(0.2);

      // Looping controls
      const [loopInfinite, setLoopInfinite] = useState(false);
      const [repeatCount, setRepeatCount] = useState(0); // 0 = no repeats
      const [repeatsDone, setRepeatsDone] = useState(0);
      const [maxMinutes, setMaxMinutes] = useState(0); // 0 = no time limit
      const [loopGap, setLoopGap] = useState(2); // seconds
      const sessionStartRef = useRef(null);

      const utteranceQueue = useRef([]);
      const currentUtteranceIndex = useRef(0);

      // Inline-src audio refs (reliable)
      const rainRef   = useRef(null);
      const wavesRef  = useRef(null);
      const audioMap = { rain: rainRef, waves: wavesRef };

      const synth = window.speechSynthesis;

      // English-only voices
      const englishVoices = voices
        .filter(v => (v.lang || '').toLowerCase().startsWith('en'))
        .sort((a,b) => (a.lang || '').localeCompare(b.lang || '') || a.name.localeCompare(b.name));

      const getSelectedVoiceObj = useCallback(() => englishVoices.find(v => v.name === selectedVoice), [englishVoices, selectedVoice]);
      const selectedVoiceObj = getSelectedVoiceObj();
      const pitchDisabled = selectedVoiceObj ? /microsoft/i.test(selectedVoiceObj.name) : false;

      const sanitizeForTTS = useCallback((str) => {
        if (!str) return '';
        let s = str.replace(/\u2026/g, '...');
        s = s.replace(/\.\.\.+/g, '...');
        s = s.replace(/\s+/g, ' ').trim();
        s = s.replace(/\[[^\]]*\]|\([^\)]*\)|\{[^}]*\}/g, ' ');
        s = s.replace(/\bhttps?:\/\/\S+|\bwww\.\S+|\S+@\S+\.\S+/g, ' ');
        s = s.replace(/[^\p{L}\p{N}\s'’-]+/gu, '');
        return s.trim();
      }, []);

      // Theme + Voices
      useEffect(() => {
        const initialMode = localStorage.getItem('theme') === 'dark'
          || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (initialMode) {
          setIsDarkMode(true);
          document.documentElement.classList.add('dark');
        }

        const loadVoices = () => {
          const list = synth.getVoices();
          if (list.length) setVoices(list);
        };
        synth.onvoiceschanged = loadVoices;
        setTimeout(loadVoices, 50);
        loadVoices();

        return () => {
          synth.cancel();
        };
      }, []);

      useEffect(() => {
        if (!selectedVoice && englishVoices.length) {
          const def = englishVoices.find(v => v.default) || englishVoices[0];
          setSelectedVoice(def.name);
        } else if (selectedVoice && !englishVoices.find(v => v.name === selectedVoice) && englishVoices.length) {
          setSelectedVoice(englishVoices[0].name);
        }
      }, [englishVoices, selectedVoice]);

      const updateUpcomingUtterances = useCallback(() => {
        if (!isSpeaking || utteranceQueue.current.length === 0) return;
        for (let i = currentUtteranceIndex.current; i < utteranceQueue.current.length; i++) {
          const u = utteranceQueue.current[i];
          const rateVariance  = (Math.random() - 0.5) * 0.5 * clarity;
          const pitchVariance = (Math.random() - 0.5) * 0.8 * clarity;
          u.rate  = Math.max(0.5, Math.min(2, baseRate  + rateVariance));
          u.pitch = Math.max(0.5, Math.min(2, basePitch + pitchVariance));
        }
      }, [isSpeaking, baseRate, basePitch, clarity]);

      useEffect(() => { updateUpcomingUtterances(); }, [baseRate, basePitch, clarity, updateUpcomingUtterances]);

      const updateProgress = useCallback(() => {
          const total = utteranceQueue.current.length;
          const current = Math.min(total, currentUtteranceIndex.current + 1);
          if (total > 0) {
            setProgress((current / total) * 100);
            setProgressText(`${current} / ${total}`);
          } else {
            setProgress(0);
            setProgressText(`0 / 0`);
          }
      }, []);

      const displayCurrentSentence = (txt) => {
        const el = document.getElementById('current-sentence');
        if (!el) return;
        el.style.opacity = 0;
        setTimeout(() => { setCurrentSentence(txt); el.style.opacity = 1; }, 200);
      };

      // Ambient
      const pauseAllAmbience = () => {
        Object.values(audioMap).forEach(ref => { if (ref.current) ref.current.pause(); });
      };
      const playAmbient = () => {
        pauseAllAmbience();
        if (ambientSound !== 'none') {
          const ref = audioMap[ambientSound]?.current;
          if (ref) {
            ref.volume = ambientVolume;
            ref.play().catch(e => console.error("Ambient audio play failed:", e));
          }
        }
      };
      const stopAmbient = () => {
        Object.values(audioMap).forEach(ref => {
          if (ref.current) { ref.current.pause(); ref.current.currentTime = 0; }
        });
      };

      useEffect(() => {
        if (ambientSound === 'none') return;
        const el = audioMap[ambientSound]?.current;
        if (el) el.volume = ambientVolume;
      }, [ambientVolume, ambientSound]);

      useEffect(() => {
        if (isSpeaking && !isPaused) playAmbient();
      }, [ambientSound]);

      // TTS
      const speakNextChunk = () => {
        if (currentUtteranceIndex.current >= utteranceQueue.current.length) {
          const runFinished = () => {
            const elapsedMs = sessionStartRef.current ? (Date.now() - sessionStartRef.current) : 0;
            const timeLimitReached = maxMinutes > 0 && elapsedMs >= maxMinutes * 60000;

            if (timeLimitReached) {
              displayCurrentSentence("Session finished (time limit).");
              setIsSpeaking(false);
              setProgress(100);
              stopAmbient();
              return;
            }

            const finiteRepeatLimitReached = !loopInfinite && repeatCount > 0 && (repeatsDone + 1) > repeatCount;
            const shouldLoop = loopInfinite || (!loopInfinite && repeatCount > 0 && !finiteRepeatLimitReached);

            if (shouldLoop) {
              setRepeatsDone(prev => prev + 1);
              setTimeout(() => { buildQueueAndSpeak(true); }, Math.max(0, loopGap) * 1000);
              return;
            }

            displayCurrentSentence("Session finished.");
            setIsSpeaking(false);
            setProgress(100);
            stopAmbient();
          };
          runFinished();
          return;
        }

        const utterance = utteranceQueue.current[currentUtteranceIndex.current];
        displayCurrentSentence(utterance.__display || utterance.text);
        updateProgress();

        utterance.onend = () => {
          currentUtteranceIndex.current++;
          const basePause =
            utterance.__pause === 'long'  ? 1200 :
            utterance.__pause === 'short' ? 400  : 150;
          const pauseDuration = basePause * (0.5 + pauseIntensity);
          setTimeout(speakNextChunk, pauseDuration);
        };
        utterance.onerror = (e) => console.error("Speech Synthesis Error", e);
        window.speechSynthesis.speak(utterance);
      };

      const buildQueueAndSpeak = (restart = false) => {
        if (window.speechSynthesis.speaking && !restart) return;
        window.speechSynthesis.cancel();

        if (!restart) {
          setRepeatsDone(0);
          sessionStartRef.current = Date.now();
        }
        if (restart && sessionStartRef.current == null) {
          sessionStartRef.current = Date.now();
        }

        const normalized = (text || '').replace(/\u2026/g, '...');
        const re = /([^,.!?]+)([,.!?]+)?/g;
        const list = [];
        let m;
        const voiceObj = getSelectedVoiceObj();
        while ((m = re.exec(normalized)) !== null) {
          const raw = (m[1] || '').trim();
          const punct = (m[2] || '').trim();
          const clean = sanitizeForTTS(raw);
          if (!clean) continue;

          const u = new SpeechSynthesisUtterance(clean);
          if (voiceObj) { u.voice = voiceObj; u.lang = voiceObj.lang; }

          const rateVariance  = (Math.random() - 0.5) * 0.5 * clarity;
          const pitchVariance = (Math.random() - 0.5) * 0.8 * clarity;
          u.rate  = Math.max(0.5, Math.min(2, baseRate  + rateVariance));
          u.pitch = Math.max(0.5, Math.min(2, basePitch + pitchVariance));

          u.__pause = (/\.\.\.|[.!?]/.test(punct)) ? 'long' : (/,/.test(punct) ? 'short' : 'none');
          u.__display = clean;

          list.push(u);
        }

        utteranceQueue.current = list;

        setIsSpeaking(true);
        setIsPaused(false);
        currentUtteranceIndex.current = 0;
        speakNextChunk();
        playAmbient();
      };
      
      const handlePlayPause = () => {
        if (text.trim() === '') return;
        if (isSpeaking) {
          if (isPaused) {
            window.speechSynthesis.resume();
            playAmbient();
            setIsPaused(false);
          } else {
            window.speechSynthesis.pause();
            pauseAllAmbience();
            setIsPaused(true);
          }
        } else {
          buildQueueAndSpeak();
        }
      };

      const handleStop = () => {
        window.speechSynthesis.cancel();
        stopAmbient();
        setIsSpeaking(false);
        setIsPaused(false);
        setProgress(0);
        setProgressText("0 / 0");
        displayCurrentSentence("Press 'Play' to begin...");
        utteranceQueue.current = [];
        currentUtteranceIndex.current = 0;
        setRepeatsDone(0);
        sessionStartRef.current = null;
      };

      const handleRestart = () => {
        if (isSpeaking || isPaused) buildQueueAndSpeak(true);
      };

      const skip = (direction) => {
        if (!isSpeaking) return;
        
        const newIndex = currentUtteranceIndex.current + direction;
        
        if (newIndex >= 0 && newIndex < utteranceQueue.current.length) {
            currentUtteranceIndex.current = newIndex;
            window.speechSynthesis.cancel(); // Cancel current and queued, then restart from new index
            // If it was paused, we resume it by re-triggering speech
            if (isPaused) {
                setIsPaused(false);
            }
            speakNextChunk();
            playAmbient();
        } else if (newIndex >= utteranceQueue.current.length) {
            // If skipping forward at the end, just stop
            handleStop();
            displayCurrentSentence("Session finished.");
        }
      };

      const toggleTheme = () => {
        const newMode = !isDarkMode;
        setIsDarkMode(newMode);
        localStorage.setItem('theme', newMode ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', newMode);
      };

      return e('div', { className: `flex flex-col lg:flex-row min-h-screen ${isFocusMode ? 'focus-mode' : ''}` },
        e('main', { className: "flex-1 p-4 sm:p-6 lg:p-8 flex flex-col transition-all duration-300 main-content" },
          e('header', { className: "flex justify-between items-center mb-4" },
            e('h1', { className: "text-2xl font-bold text-slate-900 dark:text-white" }, "Serenity Speaker"),
            e('div', { className: 'flex items-center gap-2'},
              e('button', { onClick: () => setIsFocusMode(!isFocusMode), className: "p-2 rounded-full hover:bg-slate-200 dark:hover:bg-gray-700 transition-colors" }, 
                isFocusMode ? e(MinimizeIcon, {size: 20, className: "text-slate-600 dark:text-slate-300"}) : e(MaximizeIcon, {size: 20, className: "text-slate-600 dark:text-slate-300"})
              ),
              e('button', { onClick: toggleTheme, className: "p-2 rounded-full hover:bg-slate-200 dark:hover:bg-gray-700 transition-colors" }, 
                isDarkMode ? e(SunIcon, {size: 20, className: "text-slate-300"}) : e(MoonIcon, {size: 20, className: "text-slate-600"})
              )
            )
          ),
          e('div', { className: "bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm mb-4 flex-shrink-0" },
            e('h2', { className: "text-sm font-semibold mb-2 text-gray-600 dark:text-gray-300" }, "Currently Speaking:"),
            e('p', { id: 'current-sentence', className: "text-lg text-blue-600 dark:text-blue-400 min-h-[5rem] md:min-h-[2.5rem] italic" }, currentSentence)
          ),
          e('div', { className: "relative flex-1 flex flex-col" },
            e('textarea', { value: text, onChange: ev => setText(ev.target.value), className: "w-full h-full flex-1 p-4 text-base leading-relaxed bg-white dark:bg-gray-800 border-2 border-transparent focus:border-blue-500 rounded-xl shadow-sm resize-none outline-none transition-colors", placeholder: "Paste your meditation script here..." })
          )
        ),
        e('aside', { className: "sidebar w-full lg:w-96 bg-white dark:bg-gray-800/50 lg:dark:bg-gray-800 p-4 sm:p-6 lg:p-8 border-t lg:border-t-0 lg:border-l border-slate-200 dark:border-gray-700/50 flex flex-col gap-6 sidebar-transition" },
          e('div', null,
            e('h3', { className: 'font-semibold mb-4 text-slate-900 dark:text-white' }, 'Player'),
            e('div', { className: 'bg-slate-100 dark:bg-gray-900/50 p-4 rounded-lg' },
              e('div', { className: 'w-full bg-slate-200 dark:bg-gray-700 rounded-full h-2 mb-2' },
                e('div', { className: 'bg-blue-600 h-2 rounded-full transition-all duration-300 ease-linear', style: { width: `${progress}%` } })
              ),
              e('div', { className: 'flex justify-between text-xs font-mono text-slate-500 dark:text-slate-400 mb-4' },
                e('span', null, 'Sentence:'), e('span', null, progressText)
              ),
              e('div', { className: 'flex items-center justify-center gap-4' },
                e(Tooltip, { text: 'Previous sentence' },
                  e('button', { onClick: () => skip(-1), className: 'p-2 rounded-full hover:bg-slate-200 dark:hover:bg-gray-600 transition-colors disabled:opacity-50', disabled: !isSpeaking && !isPaused },
                    e(RewindIcon, { size: 20, className: 'text-slate-600 dark:text-slate-300' })
                  )
                ),
                e(Tooltip, { text: 'Restart current run' },
                  e('button', { onClick: handleRestart, className: 'p-2 rounded-full hover:bg-slate-200 dark:hover:bg-gray-600 transition-colors disabled:opacity-50', disabled: !isSpeaking && !isPaused },
                    e(RestartIcon, { size: 20, className: 'text-slate-600 dark:text-slate-300' })
                  )
                ),
                e('button', { onClick: handlePlayPause, className: 'w-16 h-16 flex items-center justify-center bg-blue-600 text-white rounded-full shadow-lg hover:bg-blue-700 transition-all scale-100 hover:scale-105 disabled:opacity-50', disabled: text.trim() === '' },
                  e(isSpeaking && !isPaused ? PauseIcon : PlayIcon, { size: 32 })
                ),
                e(Tooltip, { text: 'Stop all' },
                  e('button', { onClick: handleStop, className: 'p-2 rounded-full hover:bg-slate-200 dark:hover:bg-gray-600 transition-colors disabled:opacity-50', disabled: !isSpeaking && !isPaused },
                    e(StopIcon, { size: 20, className: 'text-slate-600 dark:text-slate-300' })
                  )
                ),
                 e(Tooltip, { text: 'Next sentence' },
                  e('button', { onClick: () => skip(1), className: 'p-2 rounded-full hover:bg-slate-200 dark:hover:bg-gray-600 transition-colors disabled:opacity-50', disabled: !isSpeaking && !isPaused },
                    e(FastForwardIcon, { size: 20, className: 'text-slate-600 dark:text-slate-300' })
                  )
                )
              ),
              e('div', { className: 'mt-4 grid grid-cols-2 gap-3 items-end' },
                e('div', { className: 'grid grid-cols-2 gap-3 items-end col-span-2' },
                  e('div', null,
                    e('label', { htmlFor: 'repetitions-input', className: "text-sm font-medium mb-1 block" }, "Repetitions"),
                    e('input', {
                      id: 'repetitions-input', type: 'number', min: 0, step: 1, value: repeatCount,
                      onChange: ev => setRepeatCount(Math.max(0, parseInt(ev.target.value || '0', 10))),
                      className: "w-full bg-slate-100 dark:bg-gray-700 border-transparent rounded-md p-2 outline-none disabled:opacity-50 disabled:cursor-not-allowed",
                      disabled: loopInfinite
                    })
                  ),
                  e('div', { className: 'flex items-center justify-center pb-2' },
                    e('input', {
                      id: 'infinite-loop', type: 'checkbox', checked: loopInfinite,
                      onChange: ev => setLoopInfinite(ev.target.checked),
                      className: 'w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 dark:focus:ring-blue-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600'
                    }),
                    e('label', { htmlFor: 'infinite-loop', className: "ml-2 text-sm font-medium" }, "Infinite")
                  )
                ),
                e('div', { className: 'col-span-2' },
                  e('label', { className: "text-sm font-medium mb-1 block" }, "Stop after (min)"),
                  e('input', { type: 'number', min: 0, step: 0.5, value: maxMinutes, onChange: ev => setMaxMinutes(Math.max(0, parseFloat(ev.target.value || '0'))), className: "w-full bg-slate-100 dark:bg-gray-700 border-transparent rounded-md p-2 outline-none" })
                ),
                e('div', { className: 'col-span-2' },
                  e('label', { className: "text-sm font-medium mb-1 block" }, `Gap between loops: ${loopGap}s`),
                  e('input', { type: 'range', min: 0, max: 10, step: 1, value: loopGap, onChange: ev => setLoopGap(parseInt(ev.target.value || '0',10)) })
                ),
                e('div', { className: 'col-span-2 text-xs text-slate-500 dark:text-slate-400 mt-1' },
                  `Completed loops: ${repeatsDone}${loopInfinite ? ' / ∞' : (repeatCount > 0 ? ' / ' + repeatCount : '')}`
                )
              )
            )
          ),
          e('div', { className: "space-y-6" },
            e('div', null,
              e('h3', { className: "font-semibold mb-4 text-slate-900 dark:text-white" }, "Voice (English only)"),
              e('div', { className: "space-y-4" },
                e('div', null,
                  e('label', { htmlFor: "voice-select", className: "text-sm font-medium mb-1 block" }, "Voice"),
                  e('select', { id: "voice-select", value: selectedVoice, onChange: ev => setSelectedVoice(ev.target.value), className: "w-full bg-slate-100 dark:bg-gray-700 border-transparent rounded-md p-2 outline-none focus:ring-2 focus:ring-blue-500" },
                    englishVoices.map(v => e('option', { key: v.name, value: v.name }, `${v.name} (${v.lang})`))
                  )
                ),
                e('div', null,
                  e('label', { htmlFor: "rate", className: "text-sm font-medium mb-1 flex justify-between" }, "Base Speed ", e('span', null, baseRate.toFixed(2))),
                  e('input', { type: "range", id: "rate", min: 0.5, max: 1.5, value: baseRate, step: 0.05, onChange: ev => setBaseRate(parseFloat(ev.target.value)) })
                ),
                e('div', null,
                  e('label', { htmlFor: "pitch", className: "text-sm font-medium mb-1 flex justify-between" }, "Base Pitch ", e('span', null, basePitch.toFixed(2))),
                  e('input', { type: "range", id: "pitch", min: 0.5, max: 2, value: basePitch, step: 0.05, onChange: ev => setBasePitch(parseFloat(ev.target.value)), disabled: pitchDisabled, title: pitchDisabled ? "This voice may ignore pitch (Microsoft natural voices)" : "" }),
                  pitchDisabled ? e('p', { className: 'text-[11px] mt-1 text-amber-600 dark:text-amber-400' }, "Note: This voice may ignore pitch changes.") : null
                )
              )
            ),
            e('div', null,
              e('h3', { className: "font-semibold mb-4 text-slate-900 dark:text-white" }, "Humanization"),
              e('div', { className: "space-y-4" },
                e(Tooltip, { text: 'Adds subtle, random variations to pitch and speed for a more natural sound.', isBlock: true },
                  e('div', null,
                    e('label', { htmlFor: "clarity", className: "text-sm font-medium mb-1 flex justify-between" }, "Voice Clarity ", e('span', null, clarity.toFixed(2))),
                    e('input', { type: "range", id: "clarity", min: 0, max: 1, value: clarity, step: 0.1, onChange: ev => setClarity(parseFloat(ev.target.value)) })
                  )
                ),
                e(Tooltip, { text: 'Increases the length of pauses at commas and periods for a calmer pace.', isBlock: true },
                  e('div', null,
                    e('label', { htmlFor: "pause", className: "text-sm font-medium mb-1 flex justify-between" }, "Pause Intensity ", e('span', null, pauseIntensity.toFixed(2))),
                    e('input', { type: "range", id: "pause", min: 0, max: 1, value: pauseIntensity, step: 0.1, onChange: ev => setPauseIntensity(parseFloat(ev.target.value)) })
                  )
                )
              )
            ),
            e('div', null,
              e('h3', { className: "font-semibold mb-4 text-slate-900 dark:text-white" }, "Ambient Sound"),
              e('div', { className: "space-y-4" },
                e('select', { value: ambientSound, onChange: ev => setAmbientSound(ev.target.value), className: "w-full bg-slate-100 dark:bg-gray-700 border-transparent rounded-md p-2 outline-none focus:ring-2 focus:ring-blue-500" },
                  e('option', { value: "none" }, "None"),
                  e('option', { value: "rain" }, "Gentle Rain"),
                  e('option', { value: "waves" }, "Ocean Waves")
                ),
                e('div', null,
                  e('label', { htmlFor: "ambient-volume", className: "text-sm font-medium mb-1 flex justify-between" }, "Volume ", e('span', null, ambientVolume.toFixed(2))),
                  e('input', { type: "range", id: "ambient-volume", min: 0, max: 1, value: ambientVolume, step: 0.05, onChange: ev => setAmbientVolume(parseFloat(ev.target.value)) })
                )
              )
            ),
            e('div', null,
              e('h3', { className: "font-semibold mb-4 text-slate-900 dark:text-white" }, "Preset Scripts"),
              e('div', { className: "flex flex-wrap gap-2" },
                Object.entries(presets).map(([key, value]) =>
                  e('button', {
                      key,
                      onClick: () => { setText(value); handleStop(); },
                      className: 'px-3 py-1.5 text-sm font-medium bg-slate-200 dark:bg-gray-700 rounded-md hover:bg-blue-500 hover:text-white dark:hover:bg-blue-600 transition-colors'
                  }, key)
                )
              )
            )
          )
        ),
        // Inline audio sources (working primaries)
        e('audio', {
          ref: rainRef, loop: true, preload: "auto", playsInline: true,
          src: "https://www.soundjay.com/nature/rain-07.mp3",
          onError: (e) => { e.currentTarget.src = "https://assets.mixkit.co/sfx/preview/mixkit-rain-loop-2393.mp3"; e.currentTarget.load(); if (!document.hidden) { e.currentTarget.play().catch(()=>{}); } }
        }),
        e('audio', {
          ref: wavesRef, loop: true, preload: "auto", playsInline: true,
          src: "https://www.soundjay.com/nature/ocean-wave-1.mp3",
          onError: (e) => { e.currentTarget.src = "https://assets.mixkit.co/sfx/preview/mixkit-small-waves-harbor-1194.mp3"; e.currentTarget.load(); if (!document.hidden) { e.currentTarget.play().catch(()=>{}); } }
        })
      );
    };

    ReactDOM.render(React.createElement(App), document.getElementById('app'));
  </script>
</body>
</html>
