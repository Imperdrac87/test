<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrono-Budget v7.1 (Corrected Animation)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');

        :root {
            --bg-color: #1a1a1a;
            --surface-color: #2b2b2b;
            --text-color: #f0f0f0;
            --accent-color: #00aaff;
            --danger-color: #ff4444;
            --border-color: #444;
            --subtle-text: #aaa;
            --sand-color: #f0c27b;
            --wood-color: #855e42;
            --glass-stroke-color: #777;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container { width: 100%; max-width: 600px; }
        h1 { text-align: center; color: var(--accent-color); margin-bottom: 0.5rem; }
        .summary-container { text-align: center; color: var(--subtle-text); margin-bottom: 2rem; font-size: 1.1rem; }
        #task-list { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem; }
        .task-card {
            background-color: var(--surface-color);
            border-radius: 8px;
            padding: 1.5rem;
            display: flex;
            gap: 1.5rem;
            align-items: center;
            border: 2px solid transparent;
            transition: border-color 0.3s ease;
        }
        .task-card.entering { animation: slideInFade 0.5s ease-out forwards; }
        .task-card.exiting { animation: fadeOutShrink 0.4s ease-in forwards; }
        .task-card.active { border-color: var(--accent-color); animation: pulseBorder 2s infinite; }
        
        .task-details-wrapper { flex-grow: 1; display: flex; flex-direction: column; gap: 1rem; }
        .task-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 0.5rem; }
        .task-name { font-size: 1.2rem; font-weight: 500; }
        .task-time { font-size: 1rem; font-weight: 400; color: var(--subtle-text); }
        .time-chunk-display { font-size: 0.9rem; color: var(--accent-color); text-align: right; width: 100%; }
        .progress-bar { width: 100%; height: 8px; background-color: #444; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background-color: var(--accent-color); width: 0%; border-radius: 4px; transition: width 0.5s ease-in-out, background-color 0.5s ease; }
        .progress-fill.over-budget { background-color: var(--danger-color); }
        .task-controls { display: flex; gap: 1rem; justify-content: flex-end; }
        button { padding: 0.5rem 1rem; border: none; border-radius: 5px; font-family: 'Inter', sans-serif; font-weight: 500; cursor: pointer; transition: background-color 0.2s, transform 0.1s; }
        button.control-btn { background-color: var(--accent-color); color: white; }
        button.control-btn:hover { background-color: #0099dd; }
        button.delete-btn { background-color: #555; color: #ddd; }
        button.delete-btn:hover { background-color: var(--danger-color); color: white; }
        button:active { transform: scale(0.95); }

        /* --- HYPER-REALISTIC HOURGLASS --- */
        .hourglass-container {
            width: 60px; height: 90px;
            position: relative;
            flex-shrink: 0;
        }
        .hourglass-frame-top, .hourglass-frame-bottom {
            position: absolute; left: 5px; width: 50px; height: 10px;
            background: var(--wood-color); border-radius: 3px; z-index: 3;
        }
        .hourglass-frame-top { top: 0; }
        .hourglass-frame-bottom { bottom: 0; }
        .hourglass-frame-left, .hourglass-frame-right {
            position: absolute; top: 10px; width: 6px; height: 70px;
            background: var(--wood-color); z-index: 3;
        }
        .hourglass-frame-left { left: 0; }
        .hourglass-frame-right { right: 0; }

        .hourglass-svg {
            position: absolute;
            top: 10px; left: 10px;
            width: 40px; height: 70px;
            z-index: 1;
        }
        
        .sand-container {
            position: absolute;
            top: 10px; left: 10px;
            width: 40px; height: 70px;
            clip-path: url(#hourglass-clip);
            z-index: 2;
        }

        .sand-top, .sand-bottom {
             position: absolute;
             left:0;
             width: 100%;
             height: 50%;
             background: var(--sand-color);
             transition: transform 1s linear;
        }
        .sand-top {
            top: 0;
            transform: translateY(0%); /* CORRECTED: Start visible */
        }
        .sand-bottom {
            bottom:0;
            transform: translateY(100%); /* CORRECT: Start hidden */
        }
        .sand-stream {
            position: absolute;
            top: 50%; left: 50%;
            width: 2px; height: 0px;
            background: var(--sand-color);
            transform: translate(-50%, -50%);
            transition: height 0.2s;
            z-index: 3;
        }
        .sand-stream.active {
             height: 10px;
        }
        
        /* --- FORM STYLES --- */
        #add-task-form { background-color: var(--surface-color); padding: 1.5rem; border-radius: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .form-full-width { grid-column: 1 / -1; }
        #add-task-form input { width: 100%; box-sizing: border-box; padding: 0.75rem; border-radius: 5px; border: 1px solid var(--border-color); background-color: var(--bg-color); color: var(--text-color); font-size: 1rem; }
        #add-task-form input:focus { outline: 2px solid var(--accent-color); border-color: var(--accent-color); }
        #add-task-form button { width: 100%; grid-column: 1 / -1; }
        #time-chunk-inputs { grid-column: 1 / -1; display: none; grid-template-columns: 1fr 1fr; gap: 1rem; align-items: center; }
        #time-chunk-inputs span { text-align: center; }

        @keyframes slideInFade { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeOutShrink { from { opacity: 1; transform: scaleY(1); max-height: 200px; } to { opacity: 0; transform: scaleY(0); max-height: 0; } }
        @keyframes pulseBorder { 0% { box-shadow: 0 0 0 0 rgba(0, 170, 255, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(0, 170, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 170, 255, 0); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>Chrono-Budget</h1>
        <div class="summary-container">
            <div id="summary"></div>
            <div id="free-time-summary"></div>
        </div>
        <div id="task-list"></div>

        <form id="add-task-form">
            <input class="form-full-width" type="text" id="task-name-input" placeholder="Task Name" required>
            <input type="number" id="task-time-input" placeholder="Planned Minutes" min="1" required>
            <div id="time-chunk-inputs">
                <input type="time" id="task-start-time-input">
                <span>→</span>
                <input type="time" id="task-end-time-input" readonly>
            </div>
            <button type="submit" class="control-btn">Add Task</button>
        </form>
    </div>

    <script>
        const taskListEl = document.getElementById('task-list');
        const summaryEl = document.getElementById('summary');
        const freeTimeSummaryEl = document.getElementById('free-time-summary');
        const formEl = document.getElementById('add-task-form');
        const taskNameInput = document.getElementById('task-name-input');
        const taskTimeInput = document.getElementById('task-time-input');
        const timeChunkInputsEl = document.getElementById('time-chunk-inputs');
        const startTimeInput = document.getElementById('task-start-time-input');
        const endTimeInput = document.getElementById('task-end-time-input');

        let tasks = [];
        let globalTimer = null;

        function saveTasks() { localStorage.setItem('chronoTasksV7', JSON.stringify(tasks)); }
        function loadTasks() {
            const saved = localStorage.getItem('chronoTasksV7');
            if (saved) {
                tasks = JSON.parse(saved);
                tasks.forEach(task => task.isActive = false);
            }
        }
        
        function formatTime(seconds, short = false) {
            if (seconds < 0) seconds = 0;
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            let parts = [];
            if (h > 0) parts.push(`${h}h`);
            if (m > 0 || (h > 0 && !short)) parts.push(`${m}m`);
            if (!short || (h === 0 && m === 0)) parts.push(`${s}s`);
            return parts.length > 0 ? parts.join(' ') : '0s';
        }

        function renderTask(task) {
            const card = document.createElement('div');
            card.classList.add('task-card');
            card.dataset.id = task.id;
            
            card.innerHTML = `
                <div class="hourglass-container">
                    <div class="hourglass-frame-top"></div>
                    <div class="hourglass-frame-bottom"></div>
                    <div class="hourglass-frame-left"></div>
                    <div class="hourglass-frame-right"></div>
                    
                    <svg class="hourglass-svg" viewBox="0 0 40 70">
                        <defs>
                            <clipPath id="hourglass-clip">
                                <path d="M 0,0 L 40,0 C 40,20 20,20 20,35 C 20,50 40,50 40,70 L 0,70 C 0,50 20,50 20,35 C 20,20 0,20 0,0 Z" />
                            </clipPath>
                            <linearGradient id="glass-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" style="stop-color:rgba(255,255,255,0.0)" />
                                <stop offset="50%" style="stop-color:rgba(255,255,255,0.2)" />
                                <stop offset="100%" style="stop-color:rgba(255,255,255,0.0)" />
                            </linearGradient>
                        </defs>
                        <path d="M 0,0 L 40,0 C 40,20 20,20 20,35 C 20,50 40,50 40,70 L 0,70 C 0,50 20,50 20,35 C 20,20 0,20 0,0 Z" stroke="${getComputedStyle(document.documentElement).getPropertyValue('--glass-stroke-color')}" stroke-width="2" fill="url(#glass-gradient)" />
                    </svg>
                    
                    <div class="sand-container">
                        <div class="sand-top"></div>
                        <div class="sand-bottom"></div>
                    </div>
                    <div class="sand-stream"></div>
                </div>
                <div class="task-details-wrapper">
                    <div class="task-header">
                        <span class="task-name">${task.name}</span>
                        <span class="task-time">${formatTime(task.spent)} / ${task.planned}m</span>
                    </div>
                    <div class="time-chunk-display"></div>
                    <div class="progress-bar"><div class="progress-fill"></div></div>
                    <div class="task-controls">
                        <button class="control-btn" onclick="toggleTimer(${task.id})">Start</button>
                        <button class="delete-btn" onclick="deleteTask(${task.id})">Delete</button>
                    </div>
                </div>
            `;
            taskListEl.appendChild(card);
            return card;
        }

        function updateSummaries() {
            const totalSpent = tasks.reduce((sum, task) => sum + task.spent, 0);
            const totalPlanned = tasks.reduce((sum, task) => sum + (task.planned * 60), 0);
            summaryEl.innerHTML = `<strong>Total Spent:</strong> ${formatTime(totalSpent, true)} / <strong>Total Planned:</strong> ${formatTime(totalPlanned, true)}`;

            const now = new Date();
            const endOfDay = new Date();
            endOfDay.setHours(23, 59, 59, 999);
            const secondsTillEnd = (endOfDay - now) / 1000;

            let allocatedFutureSeconds = 0;
            tasks.forEach(task => {
                const startTime = new Date(task.startTime);
                if (startTime > now) {
                    allocatedFutureSeconds += task.planned * 60;
                }
            });
            
            const freeTime = secondsTillEnd - allocatedFutureSeconds;
            freeTimeSummaryEl.innerHTML = `<strong>Free Time Today:</strong> ${formatTime(freeTime)}`;
        }

        function updateAllUI() {
            tasks.forEach(task => {
                const card = document.querySelector(`.task-card[data-id='${task.id}']`);
                if (!card) return;

                const plannedSeconds = task.planned * 60;
                const progressPercent = plannedSeconds > 0 ? (task.spent / plannedSeconds) * 100 : 0;
                const isOverBudget = task.spent > plannedSeconds;
                card.querySelector('.task-time').textContent = `${formatTime(task.spent)} / ${task.planned}m`;
                const progressFill = card.querySelector('.progress-fill');
                progressFill.style.width = `${Math.min(progressPercent, 100)}%`;
                isOverBudget ? progressFill.classList.add('over-budget') : progressFill.classList.remove('over-budget');

                const controlBtn = card.querySelector('.control-btn');
                task.isActive ? card.classList.add('active') : card.classList.remove('active');
                controlBtn.textContent = task.isActive ? 'Stop' : 'Start';

                const startTime = new Date(task.startTime);
                const endTime = new Date(task.endTime);
                const timeChunkDisplay = card.querySelector('.time-chunk-display');
                timeChunkDisplay.textContent = `${startTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} - ${endTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;

                const now = new Date();
                let percentage = 0;
                let isRunning = false;
                if (now >= endTime) {
                    percentage = 100;
                } else if (now >= startTime) {
                    const totalDuration = endTime - startTime;
                    const elapsed = now - startTime;
                    percentage = (elapsed / totalDuration) * 100;
                    isRunning = true;
                }
                updateHourglass(card, percentage, isRunning);
            });
            updateSummaries();
        }
        
        function updateHourglass(card, percentage, isRunning) {
            const p = Math.min(100, Math.max(0, percentage));
            const sandTop = card.querySelector('.sand-top');
            const sandBottom = card.querySelector('.sand-bottom');
            const stream = card.querySelector('.sand-stream');
            
            if (sandTop) sandTop.style.transform = `translateY(${p}%)`; // CORRECTED: Drains down
            if (sandBottom) sandBottom.style.transform = `translateY(${100 - p}%)`; // CORRECT: Fills up
            if (stream) isRunning ? stream.classList.add('active') : stream.classList.remove('active');
        }

        function addTask(event) {
            event.preventDefault();
            const name = taskNameInput.value.trim();
            const planned = parseInt(taskTimeInput.value);
            const startTimeValue = startTimeInput.value;
            if (!name || isNaN(planned) || planned <= 0 || !startTimeValue) {
                alert('Please fill out all fields correctly.'); return;
            }
            
            const now = new Date();
            const [hours, minutes] = startTimeValue.split(':');
            const startTime = new Date();
            startTime.setHours(hours, minutes, 0, 0);

            const endTime = new Date(startTime.getTime() + planned * 60000);

            for(const task of tasks) {
                const existingStart = new Date(task.startTime);
                const existingEnd = new Date(task.endTime);
                if (startTime < existingEnd && endTime > existingStart) {
                    alert('This task overlaps with an existing task!'); return;
                }
            }
            
            tasks.push({
                id: Date.now(), name, planned, spent: 0, isActive: false,
                startTime: startTime.toISOString(),
                endTime: endTime.toISOString(),
            });
            tasks.sort((a,b) => new Date(a.startTime) - new Date(b.startTime));
            
            taskListEl.innerHTML = '';
            tasks.forEach(renderTask);

            saveTasks();
            updateAllUI();
            formEl.reset();
            timeChunkInputsEl.style.display = 'none';
        }

        function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            saveTasks();
            taskListEl.innerHTML = '';
            tasks.forEach(renderTask);
            updateAllUI();
        }

        function toggleTimer(id) {
            tasks.forEach(task => task.isActive = (task.id === id) ? !task.isActive : false);
            updateAllUI();
            saveTasks();
        }

        function tick() {
            const activeTask = tasks.find(task => task.isActive);
            if (activeTask) activeTask.spent++;
            updateAllUI();
            saveTasks();
        }

        function initializeApp() {
            loadTasks();
            tasks.sort((a,b) => new Date(a.startTime) - new Date(b.startTime));
            tasks.forEach(renderTask);
            updateAllUI();
            globalTimer = setInterval(tick, 1000);
        }

        taskTimeInput.addEventListener('input', () => {
            if (taskTimeInput.value > 0) {
                timeChunkInputsEl.style.display = 'grid';
                 const now = new Date();
                const hours = now.getHours().toString().padStart(2, '0');
                const minutes = now.getMinutes().toString().padStart(2, '0');
                startTimeInput.value = `${hours}:${minutes}`;
                startTimeInput.dispatchEvent(new Event('input'));
            } else {
                timeChunkInputsEl.style.display = 'none';
            }
        });

        startTimeInput.addEventListener('input', () => {
            const planned = parseInt(taskTimeInput.value);
            if (!isNaN(planned) && startTimeInput.value) {
                const [hours, minutes] = startTimeInput.value.split(':');
                const startTime = new Date();
                startTime.setHours(hours, minutes, 0, 0);
                const endTime = new Date(startTime.getTime() + planned * 60000);
                endTimeInput.value = `${endTime.getHours().toString().padStart(2, '0')}:${endTime.getMinutes().toString().padStart(2, '0')}`;
            }
        });

        formEl.addEventListener('submit', addTask);
        initializeApp();
    </script>
</body>
</html>
