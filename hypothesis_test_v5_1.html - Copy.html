  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {

            mono: ['JetBrains Mono', 'monospace'],

            'neon-blue': '#00e0ff',
            'neon-gold': '#ffd666',

  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <script>
    // Theme toggling logic
    function toggleTheme() {
      const body = document.body;
      if (body.getAttribute('data-theme') === 'light') {
        body.removeAttribute('data-theme');
        updateThemeLabel('Switch to Light');
      } else {
        body.setAttribute('data-theme', 'light');
        updateThemeLabel('Switch to Dark');
      }
    }
    function updateThemeLabel(txt) {
      const btn = document.getElementById('theme-toggle');
      if (btn) {
        const span = btn.querySelector('span');
        if (span) span.textContent = txt;
      }
    }
    window.addEventListener('DOMContentLoaded', () => {
      if (window.matchMedia("(prefers-color-scheme: light)").matches) {
        document.body.setAttribute('data-theme', 'light');
        updateThemeLabel('Switch to Dark');
      }
    });

    // Lucide icons hydration 
    function hydrateIcons() {
      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }
    }
    window.addEventListener('DOMContentLoaded', hydrateIcons);

    // Generalized screen switching + Lucide hydration
    function showScreen(screenId) {
      const app = document.getElementById('app');
      if (!app) return;
      const screens = app.querySelectorAll('> div');
      screens.forEach(screen => {
        screen.classList.add('hidden');
        screen.classList.remove('flex');
      });
      const el = document.getElementById(screenId);
      if (el) {
        el.classList.remove('hidden');
        el.classList.add('flex');
        el.setAttribute('tabindex', '-1');
        el.focus();
        hydrateIcons();
      }
    }
    function startGuide() {
      showScreen('guide-screen');
    }
    function showLibrary() {
      showScreen('library-screen');
    }
  </script>
