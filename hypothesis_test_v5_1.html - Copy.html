  <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script>
    // Theme toggling logic
    function toggleTheme() {
      const body = document.body;
      // If it's light mode, switch to dark (unset), else set to light
      if (body.getAttribute('data-theme') === 'light') {
        body.removeAttribute('data-theme');
        // Update label, if found
        updateThemeLabel('Switch to Light');
      } else {
        body.setAttribute('data-theme', 'light');
        updateThemeLabel('Switch to Dark');
      }
    }
    // Optional: switch the button label
    function updateThemeLabel(txt) {
      const btn = document.getElementById('theme-toggle');
      if (btn) {
        const span = btn.querySelector('span');
        if (span) span.textContent = txt;
      }
    }
    // Optionally, switch theme if user prefers dark initially
    window.addEventListener('DOMContentLoaded', () => {
      // Example: default to user's system preference
      if (window.matchMedia("(prefers-color-scheme: light)").matches) {
        document.body.setAttribute('data-theme', 'light');
        updateThemeLabel('Switch to Dark');
      }
    });
  </script>
</script>
